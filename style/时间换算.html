<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>当前时间转换器</title>

<style>
body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background: #f4f7fb;
    text-align: center;
    padding: 40px;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

button {
    background: #1677ff;
    color: white;
    border: none;
    padding: 12px 25px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #0958d9;
}

.result {
    margin-top: 25px;
    text-align: left;
    line-height: 1.8;
    font-size: 16px;
}

.time {
    color: #d4380d;
    font-weight: bold;
}
</style>

</head>

<body>

<div class="container">

<h2>⏰ 当前时间转换器</h2>

<button onclick="convertTime()">获取当前时间</button>

<div class="result" id="result">
    点击按钮显示时间
</div>

</div>


<script>

function convertTime() {

    let now = new Date();

    // 本地时间
    let local = now.toLocaleString("zh-CN", {
        timeZone: "Asia/Shanghai",
        hour12: false
    });

    // UTC时间
    let utc = now.toISOString();

    // Unix 秒
    let unixSeconds = Math.floor(now.getTime() / 1000);

    // Unix 毫秒
    let unixMilliseconds = now.getTime();


    document.getElementById("result").innerHTML = `
        <p>北京时间：<span class="time">${local}</span></p>
        <p>UTC时间：${utc}</p>
        <p>Unix秒：${unixSeconds}</p>
        <p>Unix毫秒：${unixMilliseconds}</p>
    `;
}

</script>

</body>
</html>
