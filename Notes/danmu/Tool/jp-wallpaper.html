<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>日语壁纸学习卡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@400;500;700&family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@400;500;600&family=Shippori+Mincho:wght@400;500;600&family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F5F0E1;
      --bg-rgb: 245, 240, 225;
      --surface: rgba(44, 42, 39, 0.055);
      --surface-bg-img: rgba(245, 240, 225, 0.58);
      --border: rgba(44, 42, 39, 0.12);
      --text: #2C2A27;
      --muted: #6E685F;
      --accent: #B84A39;
      --panel-bg: rgba(255, 252, 245, 0.92);
      --font-main: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Songti SC", "STSong", serif;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans", sans-serif;
      --jp-size: 30px;
      --jp-weight: 500;
      --note-word-weight: 600;
      --bg-blur: 2px;
      --bg-overlay: 0.48;
      --text-shadow: none;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* 无背景图时的细腻纸张质感 */
    body:not(.has-bg)::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.032;
      background-image: radial-gradient(var(--text) 0.6px, transparent 0.6px);
      background-size: 16px 16px;
      z-index: 1;
    }

    /* 自定义背景图层与遮罩层 */
    .bg-layer {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(var(--bg-blur));
      transform: scale(1.06);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 0;
    }

    .bg-scrim {
      position: fixed;
      inset: 0;
      background: rgba(var(--bg-rgb), var(--bg-overlay));
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, background-color 0.25s ease;
      z-index: 1;
    }

    body.has-bg .bg-layer,
    body.has-bg .bg-scrim {
      opacity: 1;
    }

    .wallpaper {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100dvh;
      padding: max(20px, env(safe-area-inset-top)) 26px max(20px, env(safe-area-inset-bottom));
      user-select: none;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .card {
      position: absolute;
      left: 50%;
      top: 0;
      width: 100%;
      max-width: 420px;
      transform: translateX(-50%);
      text-shadow: var(--text-shadow);
    }

    .tag-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .tag-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.9;
    }

    .tag-text {
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .jp-sentence {
      font-family: var(--font-main);
      font-size: var(--jp-size);
      font-weight: var(--jp-weight);
      line-height: 2.15;
      letter-spacing: 0.04em;
      word-break: keep-all;
      overflow-wrap: anywhere;
      margin-bottom: 8px;
    }

    .jp-sentence ruby {
      ruby-position: over;
    }

    .jp-sentence rt {
      font-size: 0.4em;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.06em;
      transform: translateY(-2px);
    }

    .romaji {
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--muted);
      opacity: 0.9;
      margin-bottom: 22px;
      font-style: italic;
    }

    .divider {
      width: 34px;
      height: 1.5px;
      background: var(--accent);
      opacity: 0.75;
      margin-bottom: 18px;
    }

    .zh-translation {
      font-size: 17px;
      line-height: 1.6;
      letter-spacing: 0.06em;
      color: var(--text);
      opacity: 0.92;
      margin-bottom: 26px;
    }

    .card.no-notes .zh-translation {
      margin-bottom: 0;
    }

    .notes-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-shadow: none;
    }

    body.has-bg .notes-box {
      background: var(--surface-bg-img);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .note-item {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: 13px;
      line-height: 1.55;
    }

    .note-word {
      flex-shrink: 0;
      font-family: var(--font-main);
      font-weight: var(--note-word-weight);
      color: var(--accent);
      min-width: 78px;
    }

    .note-desc {
      color: var(--text);
      opacity: 0.88;
    }

    .hidden {
      display: none !important;
    }

    /* 顶部轻提示 */
    .toast {
      position: fixed;
      top: max(18px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.76);
      color: #fff;
      font-size: 12px;
      padding: 7px 14px;
      border-radius: 999px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 60;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      opacity: 1;
    }

    /* 底部悬浮控制栏 */
    .toolbar {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: max(14px, env(safe-area-inset-bottom));
      max-width: 450px;
      margin: 0 auto;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 20;
    }

    .toolbar.hide {
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
    }

    .tool-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .strip-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .strip-label {
      flex-shrink: 0;
      font-size: 11px;
      color: var(--muted);
      min-width: 28px;
    }

    .scroll-strip {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 1px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .scroll-strip::-webkit-scrollbar {
      display: none;
    }

    .theme-badge {
      flex-shrink: 0;
      font-size: 11px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
      white-space: nowrap;
    }

    .dot-btn {
      flex-shrink: 0;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(128, 128, 128, 0.35);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .dot-btn.active {
      border-color: var(--accent);
      transform: scale(1.12);
    }

    .chip-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .chip-btn {
      flex-shrink: 0;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      line-height: 1.25;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .chip-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .chip-btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
      padding: 6px 13px;
    }

    .font-chip {
      padding: 4px 10px;
      font-size: 12px;
    }

    .sliders-wrap {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .slider-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      color: var(--muted);
      min-width: 0;
    }

    .slider-row span.label {
      flex-shrink: 0;
      min-width: 24px;
    }

    .slider-row span.val {
      flex-shrink: 0;
      min-width: 30px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      opacity: 0.85;
    }

    .slider-row input[type="range"] {
      flex: 1;
      min-width: 0;
      accent-color: var(--accent);
    }

    /* 通用弹窗 */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-mask.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-mask.center {
      align-items: center;
      padding: 20px;
    }

    .modal {
      width: 100%;
      max-width: 480px;
      background: var(--bg);
      color: var(--text);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 18px 18px max(20px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 86dvh;
      overflow-y: auto;
    }

    .modal h3 {
      font-size: 15px;
      font-weight: 600;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
    }

    .field input, .field textarea {
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    .field textarea {
      min-height: 86px;
      resize: vertical;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 4px;
    }

    /* 导出壁纸预览弹窗 */
    .export-card {
      width: 100%;
      max-width: 340px;
      background: var(--bg);
      color: var(--text);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .export-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .export-res {
      font-size: 11px;
      color: var(--muted);
      background: var(--surface);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .export-preview {
      max-height: 58dvh;
      max-width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      object-fit: contain;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
    }

    .export-tip {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.45;
    }

    .export-actions {
      width: 100%;
      display: flex;
      gap: 8px;
    }

    .export-actions .chip-btn {
      flex: 1;
      padding: 9px 12px;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-scrim" id="bgScrim"></div>
  <div class="toast" id="toast">轻触空白处隐藏工具栏，或直接点「生成壁纸」保存无边框原图</div>

  <input type="file" id="bgFileInput" accept="image/*" class="hidden" />

  <main class="wallpaper" id="wallpaper">
    <div class="stage" id="stage">
      <article class="card" id="card">
        <div class="tag-row" id="tagRow">
          <span class="tag-dot"></span>
          <span class="tag-text" id="tagText">DAILY JAPANESE</span>
        </div>

        <div class="jp-sentence" id="jpSentence"></div>
        <div class="romaji" id="romajiText"></div>

        <div class="divider"></div>
        <div class="zh-translation" id="zhText"></div>

        <section class="notes-box" id="notesBox"></section>
      </article>
    </div>
  </main>

  <aside class="toolbar" id="toolbar">
    <!-- 配色选择（12款和风主题） -->
    <div class="strip-row">
      <span class="strip-label">配色</span>
      <div class="scroll-strip" id="themeDots" aria-label="主题切换"></div>
      <span class="theme-badge" id="themeBadge">暖瓷</span>
    </div>

    <!-- 字体选择（6款日语优美字体） -->
    <div class="strip-row">
      <span class="strip-label">字体</span>
      <div class="scroll-strip" id="fontChips" aria-label="字体切换"></div>
    </div>

    <!-- 位置（0%最顶 ~ 100%最底）、字号与背景图参数 -->
    <div class="sliders-wrap">
      <div class="slider-grid">
        <div class="slider-row">
          <span class="label">位置</span>
          <input type="range" id="posSlider" min="0" max="100" value="54" step="1" />
          <span class="val" id="posVal">54%</span>
        </div>
        <div class="slider-row">
          <span class="label">字号</span>
          <input type="range" id="jpSizeSlider" min="18" max="48" value="30" step="1" />
          <span class="val" id="jpSizeVal">30</span>
        </div>
      </div>

      <div class="slider-grid hidden" id="bgSliders">
        <div class="slider-row">
          <span class="label">遮罩</span>
          <input type="range" id="overlaySlider" min="0" max="85" value="48" step="1" />
        </div>
        <div class="slider-row">
          <span class="label">模糊</span>
          <input type="range" id="blurSlider" min="0" max="16" value="2" step="1" />
        </div>
      </div>
    </div>

    <!-- 内容开关与换句/背景 -->
    <div class="tool-row">
      <div class="chip-group">
        <button class="chip-btn active" id="btnRomaji">罗马音</button>
        <button class="chip-btn active" id="btnNotes">解析</button>
        <button class="chip-btn" id="btnEdit">换句</button>
        <button class="chip-btn" id="btnPickBg">背景图</button>
        <button class="chip-btn hidden" id="btnClearBg">清除图</button>
      </div>
    </div>

    <!-- 隐藏栏与导出 -->
    <div class="tool-row">
      <button class="chip-btn" id="btnHideNow">隐藏栏</button>
      <button class="chip-btn primary" id="btnExport">生成壁纸</button>
    </div>
  </aside>

  <!-- 编辑句子弹窗 -->
  <div class="modal-mask" id="modalMask">
    <div class="modal" id="modal">
      <h3>编辑壁纸内容</h3>
      <div class="field">
        <label>顶部小标签（留空自动隐藏）</label>
        <input id="inputTag" type="text" placeholder="例如 DAILY JAPANESE / N3 每日一句" />
      </div>
      <div class="field">
        <label>日语句子（用 汉字[假名] 标注读音）</label>
        <input id="inputJp" type="text" />
      </div>
      <div class="field">
        <label>罗马音（留空自动隐藏）</label>
        <input id="inputRomaji" type="text" />
      </div>
      <div class="field">
        <label>中文释义</label>
        <input id="inputZh" type="text" />
      </div>
      <div class="field">
        <label>词汇解析（每行一条，用“|”分隔词条与解释）</label>
        <textarea id="inputNotes"></textarea>
      </div>
      <div class="modal-actions">
        <button class="chip-btn" id="btnCancel">取消</button>
        <button class="chip-btn active" id="btnSave">应用</button>
      </div>
    </div>
  </div>

  <!-- 导出壁纸预览弹窗 -->
  <div class="modal-mask center" id="exportMask">
    <div class="export-card">
      <div class="export-header">
        <h3>无边框壁纸已生成</h3>
        <span class="export-res" id="exportRes"></span>
      </div>
      <img id="exportPreview" class="export-preview" alt="壁纸预览" />
      <p class="export-tip">点击下方直接下载 PNG；若浏览器拦截下载，长按上方图片即可保存到相册</p>
      <div class="export-actions">
        <button class="chip-btn" id="btnCloseExport">返回调整</button>
        <button class="chip-btn primary" id="btnDownloadPng">保存原图</button>
      </div>
    </div>
  </div>

  <script>

      },
      indigo: {
        name: "胜色",
        bg: "#EBF0F6",

    // 统一解析 汉字[假名]，DOM 与 Canvas 共用同一套切分规则
    function tokenizeFurigana(raw) {
      const tokens = [];
      const regex = /([一-龯々ヶヵ]+[ぁ-んァ-ヶー]*)\[([^\]]+)\]/g;
      let lastIndex = 0;
      let match;

      while ((match = regex.exec(raw)) !== null) {
        if (match.index > lastIndex) {
          tokens.push({ type: "text", text: raw.slice(lastIndex, match.index) });
        }
        let b = match[1];
        let r = match[2];
        while (b.length > 1 && r.length > 1 && b[b.length - 1] === r[r.length - 1]) {
          b = b.slice(0, -1);
          r = r.slice(0, -1);
        }
        const suffix = match[1].slice(b.length);
        tokens.push({ type: "ruby", base: b, rt: r });
        if (suffix) tokens.push({ type: "text", text: suffix });
        lastIndex = regex.lastIndex;
      }

      if (lastIndex < raw.length) {
        tokens.push({ type: "text", text: raw.slice(lastIndex) });
      }
      return tokens;
    }

    // ================= 原生 Canvas 高清无边框壁纸渲染引擎 =================
    function drawRoundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawImageCover(ctx, img, w, h, extraScale = 1) {
      const imgRatio = img.naturalWidth / img.naturalHeight;
      const boxRatio = w / h;
      let drawW, drawH;
      if (imgRatio > boxRatio) {
        drawH = h * extraScale;
        drawW = drawH * imgRatio;
      } else {
        drawW = w * extraScale;
        drawH = drawW / imgRatio;
      }
      const dx = (w - drawW) / 2;
      const dy = (h - drawH) / 2;
      ctx.drawImage(img, dx, dy, drawW, drawH);
    }

    function measureTracked(ctx, text, tracking) {
      const chars = Array.from(text);
      if (!chars.length) return 0;
      let total = 0;
      for (let i = 0; i < chars.length; i++) {
        total += ctx.measureText(chars[i]).width;
        if (i < chars.length - 1) total += tracking;
      }
      return total;
    }

    function drawTracked(ctx, text, x, y, tracking) {
      const chars = Array.from(text);
      let cursor = x;
      for (let i = 0; i < chars.length; i++) {
        ctx.fillText(chars[i], cursor, y);
        cursor += ctx.measureText(chars[i]).width + tracking;
      }
    }

    function wrapSimpleText(ctx, text, maxWidth, tracking, byWord = false) {
      const lines = [];
      const units = byWord ? text.split(/(\s+)/) : Array.from(text);
      const kinsokuStart = /^[。、，．！？；：」』）\])]/;
      let current = "";

      for (const unit of units) {
        if (!unit) continue;
        const candidate = current + unit;
        if (current && measureTracked(ctx, candidate, tracking) > maxWidth) {
          if (!byWord && kinsokuStart.test(unit)) {
            lines.push(candidate);
            current = "";
          } else {
            lines.push(current.trimEnd());
            current = byWord ? unit.trimStart() : unit;
          }
        } else {
          current = candidate;
        }
      }
      if (current) lines.push(current.trimEnd());
      return lines;
    }

    async function generateWallpaper() {
      const theme = THEMES[state.theme] || THEMES.ivory;
      const fontObj = FONTS[state.font] || FONTS.serif;
      const mainFont = fontObj.family;
      const jpWeight = fontObj.weight;
      const boldWeight = fontObj.boldWeight;

      // 确保所选网络字体已加载完毕，避免导出时回退到系统默认字体
      if (document.fonts && document.fonts.load) {
        try {
          await Promise.race([
            Promise.all([
              document.fonts.load(`${jpWeight} ${state.jpSize}px ${fontObj.loadName}`, state.jp),
              document.fonts.load(`${boldWeight} 13px ${fontObj.loadName}`, state.notes.join("")),
              document.fonts.ready
            ]),
            new Promise((resolve) => setTimeout(resolve, 2500))
          ]);
        } catch (_) {}
      }

      // 自动读取手机物理屏幕竖屏比例（避开浏览器上下栏裁切）；桌面端默认 9:20
      const sw = window.screen.width || 390;
      const sh = window.screen.height || 866;
      const aspect = sh >= sw ? (sh / sw) : (20 / 9);
      const safeAspect = Math.min(Math.max(aspect, 1.6), 2.35);

      const logicalW = 390;
      const logicalH = Math.round(logicalW * safeAspect);
      const dpr = Math.max(3, Math.min(window.devicePixelRatio || 3, 4));
      const pixelW = Math.round(logicalW * dpr);
      const pixelH = Math.round(logicalH * dpr);

      const canvas = document.createElement("canvas");
      canvas.width = pixelW;
      canvas.height = pixelH;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      ctx.textBaseline = "alphabetic";

      // 1. 绘制背景
      ctx.fillStyle = theme.bg;
      ctx.fillRect(0, 0, logicalW, logicalH);

      if (state.bgImage) {
        drawImageCover(ctx, state.bgImage, logicalW, logicalH, 1.02);
        if (state.bgBlur > 0) {
          ctx.save();
          ctx.filter = `blur(${state.bgBlur}px)`;
          drawImageCover(ctx, state.bgImage, logicalW, logicalH, 1.08);
          ctx.restore();
        }
        ctx.fillStyle = `rgba(${theme.bgRgb}, ${(state.bgOverlay / 100).toFixed(2)})`;
        ctx.fillRect(0, 0, logicalW, logicalH);
      } else {
        ctx.save();
        ctx.fillStyle = theme.text;
        ctx.globalAlpha = 0.032;
        for (let y = 8; y < logicalH; y += 16) {
          for (let x = 8; x < logicalW; x += 16) {
            ctx.beginPath();
            ctx.arc(x, y, 0.55, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();
      }

      // 2. 预排版并计算整张卡片高度，与 DOM 使用完全一致的 0%~100% 行程定位
      const padX = 26;
      const padTop = 20;
      const padBottom = 20;
      const contentW = logicalW - padX * 2;

      const jpFontSize = state.jpSize;
      const jpTracking = jpFontSize * 0.04;
      const rtFontSize = Math.max(9, Math.round(jpFontSize * 0.4));
      const rtTracking = rtFontSize * 0.06;
      const jpLineHeight = jpFontSize * 2.15;

      // 将日语句子拆成可换行原子块（ruby 为不可拆分整体，普通文本按字拆分）
      const rawTokens = tokenizeFurigana(state.jp);
      const jpAtoms = [];
      for (const tk of rawTokens) {
        if (tk.type === "ruby") {
          ctx.font = `${jpWeight} ${jpFontSize}px ${mainFont}`;
          const baseW = measureTracked(ctx, tk.base, jpTracking);
          ctx.font = `400 ${rtFontSize}px ${mainFont}`;
          const rtW = measureTracked(ctx, tk.rt, rtTracking);
          jpAtoms.push({
            type: "ruby",
            base: tk.base,
            rt: tk.rt,
            baseW,
            rtW,
            width: Math.max(baseW, rtW) + jpTracking
          });
        } else {
          ctx.font = `${jpWeight} ${jpFontSize}px ${mainFont}`;
          for (const ch of Array.from(tk.text)) {
            jpAtoms.push({
              type: "char",
              char: ch,
              width: ctx.measureText(ch).width + jpTracking
            });
          }
        }
      }

      const jpLines = [];
      let curLine = [];
      let curLineW = 0;
      const jpKinsoku = /^[。、，．！？」』）]/;

      for (const atom of jpAtoms) {
        if (curLine.length && curLineW + atom.width > contentW) {
          if (atom.type === "char" && jpKinsoku.test(atom.char)) {
            curLine.push(atom);
            jpLines.push(curLine);
            curLine = [];
            curLineW = 0;
          } else {
            jpLines.push(curLine);
            curLine = [atom];
            curLineW = atom.width;
          }
        } else {
          curLine.push(atom);
          curLineW += atom.width;
        }
      }
      if (curLine.length) jpLines.push(curLine);

      // 罗马音换行
      const hasRomaji = state.showRomaji && state.romaji.trim().length > 0;
      let romajiLines = [];
      if (hasRomaji) {
        ctx.font = `italic 400 13px ${UI_FONT}`;
        romajiLines = wrapSimpleText(ctx, state.romaji.trim(), contentW, 0.5, true);
      }

      // 中文译文换行
      const hasZh = state.zh.trim().length > 0;
      let zhLines = [];
      if (hasZh) {
        ctx.font = `400 17px ${UI_FONT}`;
        zhLines = wrapSimpleText(ctx, state.zh.trim(), contentW, 1.0, false);
      }

      // 解析区布局计算
      const validNotes = state.notes.map(s => s.trim()).filter(Boolean);
      const hasNotes = state.showNotes && validNotes.length > 0;
      const noteLayouts = [];
      let notesBoxH = 0;
      if (hasNotes) {
        const boxInnerW = contentW - 32;
        const noteLineH = 20;
        let innerH = 0;
        validNotes.forEach((line, idx) => {
          const [word, ...rest] = line.split("|");
          const wText = word.trim();
          const dText = rest.join("|").trim();
          if (dText) {
            ctx.font = `${boldWeight} 13px ${mainFont}`;
            const wWidth = Math.max(78, ctx.measureText(wText).width);
            const descXOffset = Math.min(wWidth + 10, boxInnerW * 0.48);
            const descMaxW = boxInnerW - descXOffset;
            ctx.font = `400 13px ${UI_FONT}`;
            const dLines = wrapSimpleText(ctx, dText, descMaxW, 0.2, false);
            const itemH = Math.max(1, dLines.length) * noteLineH;
            noteLayouts.push({ word: wText, descLines: dLines, descXOffset, itemH });
            innerH += itemH;
          } else {
            ctx.font = `400 13px ${UI_FONT}`;
            const dLines = wrapSimpleText(ctx, wText, boxInnerW, 0.2, false);
            const itemH = Math.max(1, dLines.length) * noteLineH;
            noteLayouts.push({ word: "", descLines: dLines, descXOffset: 0, itemH });
            innerH += itemH;
          }
          if (idx < validNotes.length - 1) innerH += 10;
        });
        notesBoxH = innerH + 28;
      }

      const tagClean = (state.tag || "").trim();
      const hasTag = tagClean.length > 0;

      // 累加总高度
      let totalH = hasTag ? (14 + 18) : 0;
      totalH += jpLines.length * jpLineHeight + 8;
      if (hasRomaji) totalH += romajiLines.length * 19 + 22;
      else totalH += 10;
      totalH += 2 + 18;
      if (hasZh) totalH += zhLines.length * 27 + (hasNotes ? 26 : 0);
      if (hasNotes) totalH += notesBoxH;

      const travel = Math.max(0, (logicalH - padTop - padBottom) - totalH);
      let y = padTop + travel * (state.posY / 100);

      // 低遮罩配图时启用轻微阴影提升可读性
      const useTextShadow = Boolean(state.bgImage && state.bgOverlay < 35);
      function applyTextShadow() {
        if (!useTextShadow) return;
        ctx.shadowColor = theme.isDark ? "rgba(0,0,0,0.58)" : "rgba(255,255,255,0.72)";
        ctx.shadowBlur = 9;
        ctx.shadowOffsetY = 1.5;
      }
      function clearShadow() {
        ctx.shadowColor = "transparent";
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
      }

      // 3. 绘制顶部标签
      if (hasTag) {
        ctx.save();
        ctx.fillStyle = theme.accent;
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.arc(padX + 3, y + 6, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        applyTextShadow();
        ctx.font = `400 11px ${UI_FONT}`;
        ctx.fillStyle = theme.muted;
        drawTracked(ctx, tagClean.toUpperCase(), padX + 16, y + 10, 2.4);
        ctx.restore();
        y += 32;
      }

      // 4. 绘制日语句子 + 精准假名注音
      ctx.save();
      applyTextShadow();
      for (const line of jpLines) {
        const baselineY = y + jpFontSize * 1.48;
        let x = padX;
        for (const atom of line) {
          if (atom.type === "ruby") {
            const boxW = Math.max(atom.baseW, atom.rtW);
            const baseX = x + (boxW - atom.baseW) / 2;
            const rtX = x + (boxW - atom.rtW) / 2;

            ctx.font = `${jpWeight} ${jpFontSize}px ${mainFont}`;
            ctx.fillStyle = theme.text;
            drawTracked(ctx, atom.base, baseX, baselineY, jpTracking);

            ctx.font = `400 ${rtFontSize}px ${mainFont}`;
            ctx.fillStyle = theme.muted;
            drawTracked(ctx, atom.rt, rtX, baselineY - jpFontSize * 1.02, rtTracking);

            x += boxW + jpTracking;
          } else {
            ctx.font = `${jpWeight} ${jpFontSize}px ${mainFont}`;
            ctx.fillStyle = theme.text;
            ctx.fillText(atom.char, x, baselineY);
            x += atom.width;
          }
        }
        y += jpLineHeight;
      }
      ctx.restore();
      y += 8;

      // 5. 绘制罗马音
      if (hasRomaji) {
        ctx.save();
        applyTextShadow();
        ctx.font = `italic 400 13px ${UI_FONT}`;
        ctx.fillStyle = theme.muted;
        ctx.globalAlpha = 0.9;
        for (const rLine of romajiLines) {
          drawTracked(ctx, rLine, padX, y + 13, 0.5);
          y += 19;
        }
        ctx.restore();
        y += 22;
      } else {
        y += 10;
      }

      // 6. 绘制分割短线
      ctx.save();
      ctx.fillStyle = theme.accent;
      ctx.globalAlpha = 0.78;
      ctx.fillRect(padX, y, 34, 1.5);
      ctx.restore();
      y += 20;

      // 7. 绘制中文释义
      if (hasZh) {
        ctx.save();
        applyTextShadow();
        ctx.font = `400 17px ${UI_FONT}`;
        ctx.fillStyle = theme.text;
        ctx.globalAlpha = 0.92;
        for (const zLine of zhLines) {
          drawTracked(ctx, zLine, padX, y + 17, 1.0);
          y += 27;
        }
        ctx.restore();
        if (hasNotes) y += 26;
      }

      // 8. 绘制词汇解析卡片
      if (hasNotes) {
        clearShadow();
        ctx.save();
        drawRoundRect(ctx, padX, y, contentW, notesBoxH, 14);
        ctx.fillStyle = state.bgImage ? theme.surfaceBgImg : theme.surface;
        ctx.fill();
        ctx.strokeStyle = theme.border;
        ctx.lineWidth = 1;
        ctx.stroke();

        let ny = y + 14;
        const innerX = padX + 16;
        noteLayouts.forEach((item, idx) => {
          if (item.word) {
            ctx.font = `${boldWeight} 13px ${mainFont}`;
            ctx.fillStyle = theme.accent;
            ctx.globalAlpha = 1;
            ctx.fillText(item.word, innerX, ny + 14);
          }
          ctx.font = `400 13px ${UI_FONT}`;
          ctx.fillStyle = theme.text;
          ctx.globalAlpha = 0.88;
          item.descLines.forEach((dl, lIdx) => {
            drawTracked(ctx, dl, innerX + item.descXOffset, ny + 14 + lIdx * 20, 0.2);
          });
          ny += item.itemH + (idx < noteLayouts.length - 1 ? 10 : 0);
        });
        ctx.restore();
      }

      state.exportedDataUrl = canvas.toDataURL("image/png");
      $("exportPreview").src = state.exportedDataUrl;
      $("exportRes").textContent = `${pixelW} × ${pixelH} px`;
      $("exportMask").classList.add("open");
    }

    $("btnExport").addEventListener("click", async () => {
      const btn = $("btnExport");
      const oldText = btn.textContent;
      btn.textContent = "生成中...";
      btn.disabled = true;
      try {
        await generateWallpaper();
      } catch (err) {
        showToast("生成失败，可点「隐藏栏」后系统截屏");
      } finally {
        btn.textContent = oldText;
        btn.disabled = false;
      }
    });

    $("btnCloseExport").addEventListener("click", () => {
      $("exportMask").classList.remove("open");
    });

    $("exportMask").addEventListener("click", (e) => {
      if (e.target === $("exportMask")) $("exportMask").classList.remove("open");
    });

    $("btnDownloadPng").addEventListener("click", () => {
      if (!state.exportedDataUrl) return;
      const link = document.createElement("a");
      const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, "");
      link.download = `jp-wallpaper-${stamp}.png`;
      link.href = state.exportedDataUrl;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast("已开始下载无边框原图");
    });

    buildControls();
    render();
    showToast("位置已支持 0%–100% 全屏直达顶部与底部");
  </script>
</body>
</html>
