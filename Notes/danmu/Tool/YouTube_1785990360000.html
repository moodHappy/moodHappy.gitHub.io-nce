<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube 科普历史频道</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:"Microsoft YaHei",Arial,sans-serif;
    background:
    linear-gradient(135deg,#1e3c72,#2a5298);
    color:white;
}


.container{
    max-width:900px;
    margin:auto;
    padding:40px 20px;
}


h1{
    text-align:center;
    font-size:36px;
    margin-bottom:10px;
}


.subtitle{
    text-align:center;
    opacity:.8;
    margin-bottom:40px;
}


.grid{

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;

}



.card{

    background:rgba(255,255,255,.12);
    backdrop-filter:blur(10px);

    border-radius:20px;
    padding:30px;

    text-align:center;

    transition:.3s;

    border:1px solid rgba(255,255,255,.2);

}



.card:hover{

    transform:translateY(-8px);

    background:rgba(255,255,255,.22);

}



.icon{

    font-size:55px;
    margin-bottom:15px;

}



.title{

    font-size:24px;
    font-weight:bold;
    margin-bottom:10px;

}



.desc{

    font-size:15px;
    opacity:.85;

    min-height:45px;

}



.btn{

    display:inline-block;

    margin-top:20px;

    padding:12px 30px;

    border-radius:30px;

    background:white;

    color:#1e3c72;

    text-decoration:none;

    font-weight:bold;

    transition:.3s;

}



.btn:hover{

    background:#ffd700;

    color:#000;

}



.footer{

    text-align:center;

    margin-top:40px;

    opacity:.7;

    font-size:14px;

}



@media(max-width:600px){

    .grid{

        grid-template-columns:1fr;

    }


    h1{

        font-size:28px;

    }

}


</style>

</head>


<body>


<div class="container">


<h1>🌍 YouTube 科普 & 历史频道</h1>

<div class="subtitle">
快速进入优质英文学习频道
</div>



<div class="grid">


<div class="card">

<div class="icon">🌌</div>

<div class="title">
Kurzgesagt
</div>

<div class="desc">
宇宙 · 科学 · 生物 · 哲学动画科普
</div>


<a class="btn"
href="https://youtube.com/@kurzgesagt"
target="_blank">
进入频道
</a>

</div>




<div class="card">

<div class="icon">🎤</div>

<div class="title">
TED
</div>

<div class="desc">
思想 · 科技 · 人文 · 全球演讲
</div>


<a class="btn"
href="https://youtube.com/@ted"
target="_blank">
进入频道
</a>

</div>





<div class="card">

<div class="icon">⚔️</div>

<div class="title">
Kings and Generals
</div>

<div class="desc">
战争史 · 帝国 · 古代文明 · 军事地图
</div>


<a class="btn"
href="https://youtube.com/@kingsandgenerals"
target="_blank">
进入频道
</a>

</div>





<div class="card">

<div class="icon">📜</div>

<div class="title">
History Matters
</div>

<div class="desc">
世界历史 · 历史事件 · 简短动画
</div>


<a class="btn"
href="https://youtube.com/@historymatters"
target="_blank">
进入频道
</a>

</div>



</div>



<div class="footer">

English Learning + History Discovery

</div>


</div>


</body>
</html>
