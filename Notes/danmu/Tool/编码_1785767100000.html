<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 智能助手</title>
    <!-- Marked Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js 语法高亮 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --chat-bg: #ffffff;
            --user-msg-bg: #4f46e5;
            --user-msg-color: #ffffff;
            --ai-msg-bg: #f1f5f9;
            --ai-msg-color: #0f172a;
            --border-color: #e2e8f0;
            --text-muted: #64748b;
            --code-bg: #0d1117;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: #334155;
            display: flex;
            justify-content: center;
            height: 100vh;
            height: 100dvh; /* 移动端适配动态视口高度 */
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 960px;
            background: var(--chat-bg);
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        /* 顶部配置区域 */
        .header {
            padding: 12px 20px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            z-index: 10;
        }

        .header .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 200px;
        }

        .header label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .header input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            flex: 1;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            background: #f8fafc;
        }

        .header input:focus {
            border-color: var(--primary-color);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .header-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .header-btn:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        /* 聊天记录区域 */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message-wrapper {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .message-wrapper.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }

        .user .avatar {
            background: var(--primary-color);
            color: white;
        }

        .ai .avatar {
            background: #10b981;
            color: white;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 15px;
            word-break: break-word;
            overflow-x: auto;
        }

        .user .message-content {
            background-color: var(--user-msg-bg);
            color: var(--user-msg-color);
            border-top-right-radius: 4px;
        }

        .ai .message-content {
            background-color: var(--ai-msg-bg);
            color: var(--ai-msg-color);
            border-top-left-radius: 4px;
        }

        /* Markdown 内容样式适配 */
        .message-content p { margin-bottom: 0.8em; }
        .message-content p:last-child { margin-bottom: 0; }
        .message-content ul, .message-content ol { margin-left: 20px; margin-bottom: 0.8em; }
        .message-content h1, .message-content h2, .message-content h3 { margin: 1em 0 0.5em 0; }
        .message-content blockquote { border-left: 4px solid #cbd5e1; padding-left: 10px; color: #64748b; margin: 0.8em 0; }
        .message-content table { border-collapse: collapse; width: 100%; margin: 0.8em 0; }
        .message-content th, .message-content td { border: 1px solid var(--border-color); padding: 6px 10px; font-size: 14px; }
        .message-content inline-code { background: rgba(0,0,0,0.06); padding: 2px 5px; border-radius: 4px; font-family: monospace; font-size: 0.9em; }

        /* 代码块一键复制美化 */
        .code-block-wrapper {
            position: relative;
            margin: 10px 0;
            border-radius: 8px;
            overflow: hidden;
            background: var(--code-bg);
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            color: #94a3b8;
            padding: 6px 12px;
            font-size: 12px;
            font-family: monospace;
            border-bottom: 1px solid #334155;
        }

        .copy-code-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            transition: color 0.2s;
        }

        .copy-code-btn:hover { color: #ffffff; }

        .code-block-wrapper pre {
            margin: 0;
            padding: 12px;
            overflow-x: auto;
        }

        .code-block-wrapper pre code {
            font-family: "Fira Code", Consolas, Monaco, 'Andale Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            background: transparent !important;
            padding: 0 !important;
        }

        /* 实时流打字光标闪烁效果 */
        .streaming-cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--primary-color);
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 底部输入区域 */
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            background: #ffffff;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-area textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            resize: none;
            height: 48px;
            max-height: 160px;
            font-family: inherit;
            font-size: 15px; /* 防移动端聚焦自动放大 */
            outline: none;
            line-height: 1.5;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #f8fafc;
        }

        .input-area textarea:focus {
            border-color: var(--primary-color);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .action-btn {
            padding: 0 20px;
            height: 48px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .action-btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        .action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .action-btn.stop {
            background-color: #ef4444;
        }

        .action-btn.stop:hover {
            background-color: #dc2626;
        }

        .system-error {
            color: #ef4444 !important;
            background-color: #fef2f2 !important;
            border: 1px solid #fee2e2;
        }

        /* 移动端专属优化 */
        @media (max-width: 640px) {
            .header {
                padding: 10px 12px;
                gap: 8px;
            }
            .header .input-group {
                min-width: 100%;
            }
            .chat-box {
                padding: 12px;
                gap: 14px;
            }
            .message-content {
                max-width: 88%;
                font-size: 14px;
            }
            .input-area {
                padding: 10px 12px;
                gap: 8px;
            }
            .action-btn {
                padding: 0 14px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- 顶部配置区 -->
    <div class="header">
        <div class="input-group">
            <label for="api-key">Key:</label>
            <input type="password" id="api-key" placeholder="Bearer Token (sk-...)">
        </div>
        <div class="input-group">
            <label for="model-name">模型:</label>
            <input type="text" id="model-name" value="gpt-3.5-turbo" placeholder="如: gpt-4o, claude-3-5-sonnet">
        </div>
        <button class="header-btn" onclick="clearHistory()">清空对话</button>
    </div>

    <!-- 聊天记录区 -->
    <div class="chat-box" id="chat-box">
        <div class="message-wrapper ai">
            <div class="avatar">AI</div>
            <div class="message-content">您好！请输入您的 API Key 并选择模型。我已支持 Markdown、代码高亮一键复制以及实时打字机流输出！</div>
        </div>
    </div>

    <!-- 底部输入区 -->
    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="user-input" rows="1" placeholder="发送消息... (Enter 发送，Shift+Enter 换行)"></textarea>
        </div>
        <button id="send-btn" class="action-btn" onclick="handleSendOrStop()">发 送</button>
    </div>
</div>

<script>
    // 状态管理
    let messageHistory = [];
    let isGenerating = false;
    let abortController = null;

    // DOM 元素
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const apiKeyInput = document.getElementById('api-key');
    const modelInput = document.getElementById('model-name');

    // 初始化 Markdown 与代码高亮设置
    marked.setOptions({
        highlight: function(code, lang) {
            if (lang && hljs.getLanguage(lang)) {
                return hljs.highlight(code, { language: lang }).value;
            }
            return hljs.highlightAuto(code).value;
        },
        breaks: true
    });

    // 读取并保存 LocalStorage 配置
    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('chat_api_key');
        const savedModel = localStorage.getItem('chat_model_name');
        if (savedKey) apiKeyInput.value = savedKey;
        if (savedModel) modelInput.value = savedModel;
    });

    apiKeyInput.addEventListener('change', () => localStorage.setItem('chat_api_key', apiKeyInput.value.trim()));
    modelInput.addEventListener('change', () => localStorage.setItem('chat_model_name', modelInput.value.trim()));

    // 自动调整 textarea 高度
    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 160) + 'px';
    });

    // 键盘发送逻辑
    userInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (!isGenerating) handleSendOrStop();
        }
    });

    // 滚动到底部
    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 清空历史
    function clearHistory() {
        if (isGenerating) return;
        messageHistory = [];
        chatBox.innerHTML = `
            <div class="message-wrapper ai">
                <div class="avatar">AI</div>
                <div class="message-content">对话已清空，请输入您的问题。</div>
            </div>
        `;
    }

    // 主触发函数（发送或中断）
    function handleSendOrStop() {
        if (isGenerating) {
            if (abortController) abortController.abort();
            setGeneratingState(false);
            return;
        }
        sendMessage();
    }

    // 切换生成状态 UI
    function setGeneratingState(generating) {
        isGenerating = generating;
        if (generating) {
            sendBtn.textContent = '停 止';
            sendBtn.classList.add('stop');
        } else {
            sendBtn.textContent = '发 送';
            sendBtn.classList.remove('stop');
            sendBtn.disabled = false;
        }
    }

    // 代码块附加复制按钮 post-process
    function processCodeBlocks(element) {
        const pres = element.querySelectorAll('pre');
        pres.forEach((pre) => {
            if (pre.parentNode.classList.contains('code-block-wrapper')) return;

            const codeEl = pre.querySelector('code');
            let lang = 'code';
            if (codeEl) {
                const langClass = Array.from(codeEl.classList).find(c => c.startsWith('language-'));
                if (langClass) lang = langClass.replace('language-', '');
            }

            const wrapper = document.createElement('div');
            wrapper.className = 'code-block-wrapper';

            const header = document.createElement('div');
            header.className = 'code-header';
            header.innerHTML = `
                <span>${lang}</span>
                <button class="copy-code-btn" onclick="copyCode(this)">
                    <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    <span>复制</span>
                </button>
            `;

            pre.parentNode.insertBefore(wrapper, pre);
            wrapper.appendChild(header);
            wrapper.appendChild(pre);
        });
    }

    // 复制代码逻辑
    function copyCode(btn) {
        const wrapper = btn.closest('.code-block-wrapper');
        const codeText = wrapper.querySelector('code').innerText;

        navigator.clipboard.writeText(codeText).then(() => {
            const span = btn.querySelector('span:last-child');
            span.innerText = '已复制!';
            btn.style.color = '#10b981';
            setTimeout(() => {
                span.innerText = '复制';
                btn.style.color = '';
            }, 2000);
        }).catch(err => {
            console.error('复制失败:', err);
        });
    }

    // 渲染消息DOM，返回消息节点
    function createMessageElement(role, initialText = '') {
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${role}`;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? '你' : 'AI';

        const content = document.createElement('div');
        content.className = 'message-content';

        wrapper.appendChild(avatar);
        wrapper.appendChild(content);
        chatBox.appendChild(wrapper);

        return content;
    }

    // 发送消息核心方法（SSE 流式读取）
    async function sendMessage() {
        const apiKey = apiKeyInput.value.trim();
        const model = modelInput.value.trim();
        const text = userInput.value.trim();

        if (!text) return;
        if (!apiKey) { alert('请输入 API Key'); apiKeyInput.focus(); return; }
        if (!model) { alert('请输入模型名称'); modelInput.focus(); return; }

        // UI 准备
        userInput.value = '';
        userInput.style.height = '48px';
        setGeneratingState(true);

        // 渲染用户消息
        const userContentEl = createMessageElement('user');
        userContentEl.textContent = text;
        messageHistory.push({ role: 'user', content: text });

        // 创建 AI 占位消息框
        const aiContentEl = createMessageElement('ai');
        aiContentEl.innerHTML = '<span class="streaming-cursor"></span>';
        scrollToBottom();

        abortController = new AbortController();
        let aiMessageText = "";

        try {
            const response = await fetch('https://api.chatanywhere.tech/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: model,
                    messages: messageHistory,
                    stream: true // 开启 SSE 流式输出
                }),
                signal: abortController.signal
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error?.message || `HTTP 错误状态码: ${response.status}`);
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop(); // 保留可能不完整的最后一行

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed || trimmed.startsWith(':')) continue; // 跳过空行或注释
                    if (trimmed === 'data: [DONE]') break;

                    if (trimmed.startsWith('data: ')) {
                        try {
                            const parsed = JSON.parse(trimmed.slice(6));
                            const delta = parsed.choices[0]?.delta?.content || '';
                            if (delta) {
                                aiMessageText += delta;
                                // 实时渲染 Markdown + 流光标
                                aiContentEl.innerHTML = marked.parse(aiMessageText) + '<span class="streaming-cursor"></span>';
                                processCodeBlocks(aiContentEl);
                                scrollToBottom();
                            }
                        } catch (e) {
                            // 忽略单个 chunk 的解析异常
                        }
                    }
                }
            }

            // 补充处理 buffer 残余
            if (buffer.trim().startsWith('data: ') && buffer.trim() !== 'data: [DONE]') {
                try {
                    const parsed = JSON.parse(buffer.trim().slice(6));
                    const delta = parsed.choices[0]?.delta?.content || '';
                    if (delta) aiMessageText += delta;
                } catch(e){}
            }

            // 完成输出：去掉闪烁光标，保存历史
            aiContentEl.innerHTML = marked.parse(aiMessageText);
            processCodeBlocks(aiContentEl);
            messageHistory.push({ role: 'assistant', content: aiMessageText });

        } catch (error) {
            if (error.name === 'AbortError') {
                // 用户手动停止
                if (aiMessageText) {
                    aiContentEl.innerHTML = marked.parse(aiMessageText);
                    processCodeBlocks(aiContentEl);
                    messageHistory.push({ role: 'assistant', content: aiMessageText });
                } else {
                    aiContentEl.innerHTML = '<em>对话已停止。</em>';
                }
            } else {
                console.error(error);
                aiContentEl.classList.add('system-error');
                aiContentEl.textContent = `请求失败: ${error.message}`;
                messageHistory.pop(); // 回滚上一条用户消息
            }
        } finally {
            setGeneratingState(false);
            abortController = null;
            scrollToBottom();
        }
    }
</script>
</body>
</html>
