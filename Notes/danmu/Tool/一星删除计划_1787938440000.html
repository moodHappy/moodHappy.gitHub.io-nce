        .no-scrollbar::-webkit-scrollbar { display: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    <!-- 核心 JavaScript 逻辑 -->
    <script type="module">
        // ==========================================
        // 有道原声播放引擎
        // ==========================================
        let currentAudio = null;
        window.playYoudaoAudio = function(text) {
            if (!text) return;
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            const url = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(text)}&type=0`;
            currentAudio = new Audio(url);
            currentAudio.play().catch(e => {
                console.warn("有道音频播放失败:", e);
            });
        };

        // 核心展示逻辑：点击翻转卡片
        window.revealCard = function() {
            const frontHint = document.getElementById('front-hint');
            const dictArea = document.getElementById('dict-area');
            const fsrsControls = document.getElementById('fsrs-controls');
            
            if (frontHint) frontHint.classList.add('hidden');
            if (dictArea) {
                dictArea.classList.remove('hidden');
                dictArea.classList.add('flex');
            }
            if (fsrsControls) {
                fsrsControls.classList.remove('hidden');
                fsrsControls.classList.add('flex');
            }
        };

        // ==========================================
        // 溯源双语语料库例句匹配算法
        // ==========================================
        function getWordForms(word) {
            let forms = new Set([word.toLowerCase().trim()]);
            try {
                if (typeof nlp !== 'undefined') {
                    let doc = nlp(word);
                    let verbs = doc.verbs().conjugate();
                    if (verbs && verbs.length > 0) {
                        Object.values(verbs[0]).forEach(v => { if (v) forms.add(v.toLowerCase()); });
                    }
                    let nouns = doc.nouns();
                    if (nouns && nouns.length > 0) {
                        nouns.toPlural().out('array').forEach(n => forms.add(n.toLowerCase()));
                        nlp(word).nouns().toSingular().out('array').forEach(n => forms.add(n.toLowerCase()));
                    }
                }
            } catch(e) {}
            return Array.from(forms);
        }

        function findRandomSuyuanSentence(word) {
            if (!window.__SUYUAN_CORPUS__ || !Array.isArray(window.__SUYUAN_CORPUS__)) return null;
            const forms = getWordForms(word);
            const escapedForms = forms.map(f => f.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            const regex = new RegExp('\\b(' + escapedForms.join('|') + ')\\b', 'i');
            
            let matches = [];
            for (const item of window.__SUYUAN_CORPUS__) {
                if (!item.s || !Array.isArray(item.s)) continue;
                for (const pair of item.s) {
                    const en = pair[0];
                    const zh = pair[1] || '';
                    if (!en) continue;
                    const m = en.match(regex);
                    if (m) {
                        matches.push({
                            path: item.p,
                            matchedWord: m[0],
                            en: en,
                            zh: zh
                        });
                    }
                }
            }
            if (matches.length === 0) return null;
            const chosen = matches[Math.floor(Math.random() * matches.length)];
            
            const hlRegex = new RegExp('\\b(' + escapedForms.join('|') + ')\\b', 'gi');
            const highlightedEn = chosen.en.replace(hlRegex, '<span class="text-red-600 font-bold bg-red-50 px-1 py-0.5 rounded border border-red-100/60">$1</span>');
            
            return {
                ...chosen,
                highlightedEn
            };
        }

        // ==========================================
        // 外部 FSRS 算法库加载
        // ==========================================
        let FSRS_API = null;
        let fsrsEngine = null;
        try {
            const module = await import('https://cdn.jsdelivr.net/npm/ts-fsrs@3.5.0/+esm');
            FSRS_API = module;
            fsrsEngine = module.fsrs(); 
        } catch (err) {
            alert("加载外部 FSRS 库失败，请检查网络。");
            console.error(err);
        }

        // ==========================================
        // 双击全屏沉浸逻辑
        // ==========================================
        const controlsPanel = document.getElementById('controls-panel');
        const learningContainer = document.getElementById('learning-container');
        
        learningContainer.addEventListener('dblclick', function(e) {
            if(e.target.tagName.toLowerCase() === 'button' || e.target.closest('button')) return;
            controlsPanel.classList.toggle('collapsed');
        });

        // ==========================================
        // IndexedDB 核心封装
        // ==========================================
        const DB_NAME = 'WordSyncProDB_Max_V7'; 
        const DB_VERSION = 1;
        const STORE_APP = 'app_store';

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = e => {
                    if (!e.target.result.objectStoreNames.contains(STORE_APP)) e.target.result.createObjectStore(STORE_APP);
                };
                req.onsuccess = e => resolve(e.target.result);
                req.onerror = e => reject(e.target.error);
            });
        }
        async function idbGet(key) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const req = db.transaction(STORE_APP, 'readonly').objectStore(STORE_APP).get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }
        async function idbSet(key, val) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const req = db.transaction(STORE_APP, 'readwrite').objectStore(STORE_APP).put(val, key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        // ==========================================
        // 标记修改以进行智能合并（仅在实际学习/删除操作时触发）
        // ==========================================
        async function markWordsDirty() {
            await idbSet('words_local_dirty', true);
            await idbSet('local_words_updated_at', Date.now());
        }
        
        async function markProgressDirty() {
            await idbSet('progress_local_dirty', true);
            await idbSet('local_progress_updated_at', Date.now());
        }

        // ==========================================
        // 状态变量与缓存数据
        // ==========================================
        let words = [];             
        let displayWords = [];      
        let fileSha = '';           
        
        let oneWords = [];          
        let oneFileSha = '';        
        let oneTxtSet = new Set();  
        
        let backupFileSha = '';     
        let memoryStats = {};       
        let dictCache = {};         
        let trash = []; 
        
        let currentFilter = '';
        let viewMode = 'fsrs';      
        let currentCardIndex = 0;
        let confirmDeleteEnabled = true;

        const DOM = {
            btnSettings: document.getElementById('btn-settings'),
            modalSettings: document.getElementById('settings-modal'),
            btnCloseSettings: document.getElementById('close-settings'),
            btnSaveConfig: document.getElementById('btn-save-config'),
            
            btnSyncWords: document.getElementById('btn-sync-words'),
            btnSyncStar: document.getElementById('btn-sync-star'),
            btnSyncProgress: document.getElementById('btn-sync-progress'),
            
            btnToggleConfirm: document.getElementById('btn-toggle-confirm'),
            
            btnTrash: document.getElementById('btn-trash'),
            modalTrash: document.getElementById('trash-modal'),
            btnCloseTrash: document.getElementById('close-trash'),
            trashList: document.getElementById('trash-list'),
            trashCount: document.getElementById('trash-count'),
            
            modeBtns: document.querySelectorAll('.mode-btn'),
            wordListEl: document.getElementById('word-list'),
            wordCountEl: document.getElementById('word-count'),
            todayCountEl: document.getElementById('today-count'),
            poolCountEl: document.getElementById('pool-count'),
            fsrsBadge: document.getElementById('fsrs-badge'),
            searchInput: document.getElementById('search-input'),
            statusBar: document.getElementById('status-bar'),
            
            cfgToken: document.getElementById('cfg-token'),
            cfgOwner: document.getElementById('cfg-owner'),
            cfgRepo: document.getElementById('cfg-repo'),
            cfgPath: document.getElementById('cfg-path'),
            cfgPathTwo: document.getElementById('cfg-path-two'),
            cfgBackupRepo: document.getElementById('cfg-backup-repo'),
            cfgBackupPath: document.getElementById('cfg-backup-path')
        };

        // ==========================================
        // 解析并渲染有道词典 + 溯源例句
        // ==========================================
        function parseAndRenderDict(data, currentWord) {
            const dictArea = document.getElementById('dict-area');
            if (!dictArea) return;

            const isStar = oneTxtSet.has(currentWord.toLowerCase());
            const starHTML = isStar

        async function updateTodayCountDisplay(increment = false, decrement = false) {
            const todayStr = new Date().toISOString().slice(0, 10);
            let stats = await idbGet('stats') || { date: todayStr, count: 0 };
            let changed = false;
            if (stats.date !== todayStr) { 
                stats.date = todayStr; 
                stats.count = 0; 
                changed = true;
            }
            if (increment) { stats.count++; changed = true; }
            if (decrement && stats.count > 0) { stats.count--; changed = true; }
            
            if (changed) {
                await idbSet('stats', stats);
            }
            DOM.todayCountEl.textContent = `今日已删: ${stats.count}`;
        }

        // ==========================================
        // GitHub API 交互辅助
        // ==========================================
        function base64ToUtf8(base64) { try { return decodeURIComponent(Array.prototype.map.call(atob(base64), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')); } catch (e) { return atob(base64); } }
        function utf8ToBase64(str) { return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1))); }

        async function fetchGitHubFile(config, owner, repo, filepath) {
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${filepath}?t=${Date.now()}`;
            const res = await fetch(url, { headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3+json' } });
            if (!res.ok) throw new Error(`请求 ${filepath} 失败: ${res.status}`);
            return await res.json();
        }

        async function getRemoteFileSha(config, owner, repo, filepath) {
            try {
                const url = `https://api.github.com/repos/${owner}/${repo}/contents/${filepath}?t=${Date.now()}`;
                const res = await fetch(url, { headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3+json' } });
                if (res.ok) return (await res.json()).sha;
            } catch (e) { console.warn(`检测远程 ${filepath} SHA 异常:`, e); }
            return null;
        }

        async function getRemoteFileTime(config, owner, repo, filepath) {
            try {
                const url = `https://api.github.com/repos/${owner}/${repo}/commits?path=${filepath}&page=1&per_page=1&t=${Date.now()}`;
                const res = await fetch(url, { headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3+json' } });
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.length > 0) return new Date(data[0].commit.committer.date).getTime();
                }
            } catch (e) { console.warn(`拉取远程 commit 时间异常:`, e); }
            return 0;
        }

        async function syncStarWords() {

            DOM.btnSyncStar.setAttribute('disabled', 'true');

            try {

                const encOne = utf8ToBase64(oneWords.join('\n') + (oneWords.length ? '\n' : ''));
                const putOneBody = { 
                    message: `WordSync Pro: Sync Starred Words (${new Date().toISOString().slice(0, 10)})`, 
                    content: encOne 
                };
                if (curOneSha) putOneBody.sha = curOneSha;

                const resOne = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.pathTwo}`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `token ${config.token}`, 
                        'Content-Type': 'application/json', 
                        'Accept': 'application/vnd.github.v3+json' 
                    },
                    body: JSON.stringify(putOneBody)
                });

                if (!resOne.ok) {

                showStatus(`五星词库同步失败: ${err.message}`, 'error');
            } finally {
                DOM.btnSyncStar.removeAttribute('disabled');
            }
        }

        // ==========================================
        // 智能双向同步逻辑 (主词库)
        // ==========================================
        async function syncWordsAuto(silent = false) {
            const config = await idbGet('config');
            if (!config || !config.token) {
                if (!silent) DOM.modalSettings.classList.remove('hidden');
                return;
            }

            DOM.btnSyncWords.setAttribute('disabled', 'true');
            if (!silent) showStatus('🔄 正在比对主词库状态...', 'info');

            try {
                const isDirty = await idbGet('words_local_dirty') || false;
                const curMainSha = await getRemoteFileSha(config, config.owner, config.repo, config.path);

                if (curMainSha === fileSha) {
                    if (isDirty) {
                        await pushWordsCore(config, curMainSha);
                    } else {
                        if (!silent) showStatus('✅ 主词库已是最新，无需同步', 'success');
                    }
                } else {
                    if (isDirty) {
                        const remoteTime = await getRemoteFileTime(config, config.owner, config.repo, config.path);
                        const localTime = await idbGet('local_words_updated_at') || 0;
                        
                        if (localTime > remoteTime) {
                            showStatus('⚠️ 判定本地更新较新，推送主词库至云端...', 'info');
                            await pushWordsCore(config, curMainSha);
                        } else {
                            showStatus('⚠️ 判定云端较新，覆盖本地词库...', 'info');
                            await pullWordsCore(config);
                        }
                    } else {

                    }
                }
            } catch (err) {
                if (!silent) showStatus(`词库同步异常: ${err.message}`, 'error');
            } finally {
                DOM.btnSyncWords.removeAttribute('disabled');
            }
        }

        async function pushWordsCore(config, mainSha) {
            let syncSuccess = true;
            let msgs = [];
            try {
                const encMain = utf8ToBase64(words.join('\n') + (words.length ? '\n' : ''));
                const putMainBody = { message: `WordSync Pro: Sync Words (${new Date().toISOString().slice(0,10)})`, content: encMain };
                if (mainSha) putMainBody.sha = mainSha;

                const resMain = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.path}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
                    body: JSON.stringify(putMainBody)
                });
                if (!resMain.ok) throw new Error((await resMain.json()).message);
                const dataMain = await resMain.json();
                fileSha = dataMain.content.sha;
                await idbSet('words_cache', { words, fileSha });
                msgs.push('主库成功');
            } catch(err) { syncSuccess = false; msgs.push(`主库失败: ${err.message}`); }

            const isOneDirty = await idbGet('one_dirty');
            if (isOneDirty && config.pathTwo) {
                try {
                    const curOneSha = await getRemoteFileSha(config, config.owner, config.repo, config.pathTwo) || oneFileSha;
                    const encOne = utf8ToBase64(oneWords.join('\n') + (oneWords.length ? '\n' : ''));
                    const putOneBody = { message: `WordSync Pro: Sync Starred (${new Date().toISOString().slice(0,10)})`, content: encOne };
                    if (curOneSha) putOneBody.sha = curOneSha;

                    const resOne = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.pathTwo}`, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
                        body: JSON.stringify(putOneBody)
                    });
                    if (!resOne.ok) throw new Error((await resOne.json()).message);
                    const dataOne = await resOne.json();
                    oneFileSha = dataOne.content.sha;
                    await idbSet('one_cache', { words: oneWords, fileSha: oneFileSha });
                    await idbSet('one_dirty', false);
                    msgs.push('五星库联动推送成功');
                } catch(err) { msgs.push(`五星库联动未完成: ${err.message}`); }
            }

            if (syncSuccess) {
                await idbSet('words_local_dirty', false); 
                showStatus(`🎉 词库推送成功！(${msgs.join(', ')})`, 'success'); 
            } else { 
                showStatus(`⚠ 同步异常: ${msgs.join(' | ')}`, 'error'); 
            }
        }

        async function pullWordsCore(config) {
            const fetchPromises = [fetchGitHubFile(config, config.owner, config.repo, config.path)];
            if (config.pathTwo) fetchPromises.push(fetchGitHubFile(config, config.owner, config.repo, config.pathTwo).catch(e => null));
            const results = await Promise.all(fetchPromises);
            
            const mainData = results[0];
            const oneData = results[1];

            fileSha = mainData.sha;
            words = base64ToUtf8(mainData.content).split(/\r?\n/).map(w => w.trim()).filter(w => w.length > 0);
            await idbSet('words_cache', { words, fileSha });

            if (oneData) {
                const isOneDirty = await idbGet('one_dirty') || false;
                // 关键修复：本地有删除或变更五星词时，绝不被云端直接覆盖还原
                if (!isOneDirty) {
                    oneWords = base64ToUtf8(oneData.content).split(/\r?\n/).map(w => w.trim()).filter(w => w.length > 0);
                    oneFileSha = oneData.sha;
                    await idbSet('one_cache', { words: oneWords, fileSha: oneFileSha });
                    oneTxtSet = new Set(oneWords.map(w => w.toLowerCase()));
                }
            }

            await idbSet('words_local_dirty', false); 
            showStatus(`🎉 词库拉取成功！已同步 ${words.length} 词`, 'success');
            switchMode(viewMode);
        }

        // ==========================================
        // 双向智能合并进度 (Progress)
        // ==========================================
        function getCardTimestamp(card) {
            if (!card) return 0;
            if (card.updatedAt) return card.updatedAt;
            if (card.last_review) return new Date(card.last_review).getTime();
            if (card.due) return new Date(card.due).getTime();
            return 0;
        }

        function mergeMemoryStats(localStats, remoteStats) {
            const merged = { ...remoteStats };
            for (const [word, localCard] of Object.entries(localStats || {})) {
                if (!merged[word]) {
                    merged[word] = localCard;
                } else {
                    const remoteCard = merged[word];
                    const localTime = getCardTimestamp(localCard);
                    const remoteTime = getCardTimestamp(remoteCard);

                    if (localTime > remoteTime) {
                        merged[word] = localCard;
                    } else if (remoteTime > localTime) {
                        merged[word] = remoteCard;
                    } else {
                        if ((localCard.reps || 0) >= (remoteCard.reps || 0)) {
                            merged[word] = localCard;
                        }
                    }
                }
            }
            return merged;
        }

        function mergeTrash(localTrash, remoteTrash) {
            const map = new Map();
            (remoteTrash || []).forEach(item => {
                if (item && item.word) map.set(item.word.toLowerCase(), item);
            });
            (localTrash || []).forEach(item => {
                if (!item || !item.word) return;
                const key = item.word.toLowerCase();
                if (!map.has(key) || (item.deletedAt || 0) > (map.get(key).deletedAt || 0)) {
                    map.set(key, item);
                }
            });
            return Array.from(map.values()).sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0));
        }

        function mergeStats(localStats, remoteStats) {
            const todayStr = new Date().toISOString().slice(0, 10);
            if (!localStats && !remoteStats) return { date: todayStr, count: 0 };
            if (!localStats) return remoteStats;
            if (!remoteStats) return localStats;
            
            if (remoteStats.date === todayStr && localStats.date === todayStr) {
                return { date: todayStr, count: Math.max(localStats.count || 0, remoteStats.count || 0) };
            }
            if (remoteStats.date === todayStr) return remoteStats;
            if (localStats.date === todayStr) return localStats;
            return remoteStats;
        }

        async function syncProgressAuto(silent = false) {
            const config = await idbGet('config');
            if (!config || !config.token) {
                if (!silent) DOM.modalSettings.classList.remove('hidden');
                return;
            }
            if (!config.backupRepo || !config.backupPath) {
                if (!silent) alert('请配置正确的备份仓库与路径。');
                return;
            }

            DOM.btnSyncProgress.setAttribute('disabled', 'true');
            if (!silent) showStatus('🔄 正在比对学习进度状态...', 'info');

            try {
                const isDirty = await idbGet('progress_local_dirty') || false;
                const curSha = await getRemoteFileSha(config, config.owner, config.backupRepo, config.backupPath);

                if (curSha === backupFileSha) {
                    if (isDirty) {
                        await pushProgressCore(config, curSha);
                    } else {
                        if (!silent) showStatus('✅ 进度已是最新，无需同步', 'success');
                    }
                } else {
                    const backupData = await fetchGitHubFile(config, config.owner, config.backupRepo, config.backupPath);
                    const backupJson = JSON.parse(base64ToUtf8(backupData.content));
                    
                    if (isDirty) {
                        showStatus('🔄 检测到多设备记录，正在智能合并学习进度...', 'info');
                        const mergedStats = mergeMemoryStats(memoryStats, backupJson.memoryStats || {});
                        const mergedTrash = mergeTrash(trash, backupJson.trash || []);
                        const localTodayStats = await idbGet('stats');
                        const mergedTodayStats = mergeStats(localTodayStats, backupJson.stats);
                        
                        memoryStats = mergedStats;
                        trash = mergedTrash;
                        await idbSet('memory_stats', memoryStats);
                        await idbSet('trash_bin', trash);
                        await idbSet('stats', mergedTodayStats);
                        renderTrash();
                        await updateTodayCountDisplay(false, false);
                        
                        await pushProgressCore(config, backupData.sha);
                        showStatus('🎉 已智能双向合并云端与本地进度！', 'success');
                        switchMode(viewMode);
                    } else {
                        await applyProgressCore(backupData, backupJson);
                    }
                }
            } catch (err) {
                if (err.message && err.message.includes('404')) {
                    showStatus('未找到云端进度文件，正尝试首次创建...', 'info');
                    await pushProgressCore(config, null);
                } else {
                    if (!silent) showStatus(`进度同步异常: ${err.message}`, 'error');
                }
            } finally {
                DOM.btnSyncProgress.removeAttribute('disabled');
            }
        }

        async function pushProgressCore(config, latestSha) {
            const todayStats = await idbGet('stats');
            const nowTime = Date.now();
            const backupPayload = JSON.stringify({
                updatedAt: nowTime,
                memoryStats: memoryStats, 
                trash: trash,
                stats: todayStats
            }, null, 2);
            
            const putBody = {
                message: `WordSync Pro: Backup Study Record (${new Date().toISOString().slice(0,10)})`,
                content: utf8ToBase64(backupPayload)
            };
            if (latestSha) putBody.sha = latestSha;

            const resBackup = await fetch(`https://api.github.com/repos/${config.owner}/${config.backupRepo}/contents/${config.backupPath}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
                body: JSON.stringify(putBody)
            });
            
            if (!resBackup.ok) throw new Error((await resBackup.json()).message);
            const dataBackup = await resBackup.json();
            
            backupFileSha = dataBackup.content.sha;
            await idbSet('backup_file_sha', backupFileSha);
            await idbSet('progress_local_dirty', false); 
            await idbSet('local_progress_updated_at', nowTime);
            
            showStatus('🎉 学习进度推送成功！', 'success');
        }

        async function applyProgressCore(backupData, backupJson) {
            backupFileSha = backupData.sha;
            await idbSet('backup_file_sha', backupFileSha);

            if (backupJson.memoryStats) {
                memoryStats = backupJson.memoryStats;
                await idbSet('memory_stats', memoryStats);
            }
            if (backupJson.trash && Array.isArray(backupJson.trash)) {
                trash = backupJson.trash;
                await idbSet('trash_bin', trash);
                renderTrash();
            }
            if (backupJson.stats) {
                await idbSet('stats', backupJson.stats);
                await updateTodayCountDisplay(false, false);
            }

            await idbSet('progress_local_dirty', false); 
            await idbSet('local_progress_updated_at', backupJson.updatedAt || Date.now());
            showStatus('🎉 进度拉取成功！已还原最新状态', 'success');
            switchMode(viewMode);
        }

        DOM.btnSyncWords.addEventListener('click', () => syncWordsAuto(false));
        DOM.btnSyncProgress.addEventListener('click', () => syncProgressAuto(false));

        // ==========================================
        // 核心：处理序列化及 FSRS 调度逻辑
        // ==========================================
        function getNextReviewTime(intervalDays) {
            if (intervalDays <= 0) return Date.now(); 
            const now = new Date();
            const logicalNow = new Date(now.getTime() - 4 * 60 * 60 * 1000);
            logicalNow.setHours(0, 0, 0, 0);
            logicalNow.setDate(logicalNow.getDate() + intervalDays);
            return logicalNow.getTime() + 4 * 60 * 60 * 1000;
        }

        function hydrateCard(raw) {
            if (!raw || !raw.due) return FSRS_API.createEmptyCard(new Date());
            let card = { ...raw };
            if (card.due) card.due = new Date(card.due);
            if (card.last_review) card.last_review = new Date(card.last_review);
            return card;
        }

        function getSimulatedInterval(word, gradeStr) {
            if (!FSRS_API) return "?";
            let card = hydrateCard(memoryStats[word]);
            let now = new Date();
            
            try {
                let scheduling_cards = fsrsEngine.repeat(card, now);
                let targetGrade = parseInt(gradeStr, 10);
                let scheduled_days = scheduling_cards[targetGrade].card.scheduled_days;
                return scheduled_days === 0 ? "今天" : `${scheduled_days}天`;
            } catch(e) {
                console.error(e);
                return "?";
            }
        }

        window.rateWordFSRS = async function(word, qualityStr) {
            if (!FSRS_API) return showStatus("FSRS引擎异常", "error");
            
            let card = hydrateCard(memoryStats[word]);
            let now = new Date();
            let targetGrade = parseInt(qualityStr, 10);

            try {
                let scheduling_cards = fsrsEngine.repeat(card, now);
                let next_card = scheduling_cards[targetGrade].card;
                
                next_card.nextDate = getNextReviewTime(next_card.scheduled_days);
                next_card.updatedAt = Date.now();
                
                memoryStats[word] = next_card;
                await idbSet('memory_stats', memoryStats);
                await markProgressDirty(); 

                displayWords.splice(currentCardIndex, 1);
                if (currentCardIndex >= displayWords.length) currentCardIndex = Math.max(0, displayWords.length - 1);
                
                renderWords();
                const msg = next_card.scheduled_days === 0 ? '🔴 稍后重来' : `${targetGrade === 2 ? '🟠' : targetGrade === 3 ? '🟢' : '🔵'} 已安排在 ${next_card.scheduled_days} 天后复习`;
                showStatus(msg, 'info');

            } catch (err) {
                showStatus(`打分计算失败: ${err.message}`, 'error');
            }
        }

        function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }

        function renderTrash() {
            DOM.trashCount.textContent = trash.length;
            if (trash.length === 0) {
                DOM.trashList.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm font-medium">回收站是空的</div>`;
                return;
            }
            DOM.trashList.innerHTML = trash.map((item, idx) => {
                const d = new Date(item.deletedAt);
                const timeStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
                return `
                    <div class="flex items-center justify-between p-3 mb-2 bg-slate-50 border border-slate-100 rounded-2xl hover:border-blue-200 transition">
                        <div class="flex flex-col truncate pr-2">
                            <span class="font-extrabold text-slate-700 text-sm truncate">${escapeHtml(item.word)}</span>
                            <span class="text-[10px] text-slate-400 mt-0.5">删于 ${timeStr} ${item.inOne ? '<span class="text-yellow-500 font-bold ml-1">★ 曾属星标</span>' : ''}</span>
                        </div>
                        <button onclick="restoreWord(${idx})" class="px-3.5 py-1.5 bg-green-50 text-green-700 hover:bg-green-500 hover:text-white rounded-xl text-xs font-extrabold shadow-sm transition active:scale-95">恢复</button>
                    </div>
                `;
            }).join('');
        }

        window.restoreWord = async function(index) {
            const item = trash[index];
            const lower = item.word.trim().toLowerCase();

            if (item.inMain && !words.some(w => w.trim().toLowerCase() === lower)) {
                words.push(item.word);
                await markWordsDirty();
                await idbSet('words_cache', { words, fileSha });
            }
            if (item.inOne) {
                if (!oneWords.some(w => w.trim().toLowerCase() === lower)) {
                    oneWords.push(item.word);
                    oneTxtSet.add(lower);
                }
                await idbSet('one_dirty', true);
                await idbSet('one_cache', { words: oneWords, fileSha: oneFileSha });
            }
            
            trash.splice(index, 1);
            await idbSet('trash_bin', trash);
            await markProgressDirty(); 

            const todayStr = new Date().toISOString().slice(0, 10);
            const delStr = new Date(item.deletedAt).toISOString().slice(0, 10);
            if (todayStr === delStr) await updateTodayCountDisplay(false, true);
            
            renderTrash();
            switchMode(viewMode);
            showStatus(`已成功恢复 "${item.word}" 💊`, 'success');
        };

        // 核心删除逻辑：精准移除主库、五星库及学习池
        window.removeWord = async function(wordTarget) {
            if (confirmDeleteEnabled && !confirm(`确认将 "${wordTarget}" 踢出词库吗？\n如果它是星标词或正在学习池中，也会一并被清退！`)) return;

            let inMain = false;
            let inOne = false;
            const lowerTarget = wordTarget.trim().toLowerCase();

            // 1. 从主词库移除
            const mainIdx = words.findIndex(w => w.trim().toLowerCase() === lowerTarget);
            if (mainIdx > -1) { 
                words.splice(mainIdx, 1); 
                inMain = true; 
            }

            // 2. 从五星联动库移除
            const oneIdx = oneWords.findIndex(w => w.trim().toLowerCase() === lowerTarget);
            if (oneIdx > -1) {
                oneWords.splice(oneIdx, 1);
                oneTxtSet.delete(lowerTarget);
                inOne = true;
            }

            // 3. 从 FSRS 记忆库移除
            if (memoryStats[wordTarget]) {
                delete memoryStats[wordTarget];
                await idbSet('memory_stats', memoryStats);
            }

            if (inMain || inOne) {
                // 标记五星库被修改
                if (inOne) {
                    await idbSet('one_dirty', true);
                    await idbSet('one_cache', { words: oneWords, fileSha: oneFileSha });
                }
                if (inMain) {
                    await markWordsDirty();
                    await idbSet('words_cache', { words, fileSha });
                }

                trash.unshift({ word: wordTarget, inMain, inOne, deletedAt: Date.now() });
                await idbSet('trash_bin', trash);
                await markProgressDirty(); 

                const displayIndex = displayWords.findIndex(w => w.trim().toLowerCase() === lowerTarget);
                if (displayIndex > -1) {
                    displayWords.splice(displayIndex, 1);
                    if (currentCardIndex >= displayWords.length) currentCardIndex = Math.max(0, displayWords.length - 1);
                }

                await updateTodayCountDisplay(true, false);
                renderWords();
                renderTrash();
                DOM.trashCount.textContent = trash.length;
                
                showStatus(`已删除 "${wordTarget}"。记得点击【⭐ 五星同步词库】同步至云端！`, 'info');
            }
        };

                            <!-- 正面引导区：点击任意区域翻开卡片 -->
                            <div id="front-hint" class="flex flex-col items-center mt-6 w-full">
                                <button onclick="event.stopPropagation(); playYoudaoAudio('${escapeHtml(currentWord)}')" class="w-12 h-12 rounded-full bg-blue-50 text-blue-500 hover:bg-blue-100 flex items-center justify-center transition shrink-0 active:scale-95 shadow-sm mb-4">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 001.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06zM18.584 5.106a.75.75 0 011.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 11-1.06-1.06 8.25 8.25 0 000-11.668.75.75 0 010-1.06z" /><path d="M15.932 7.757a.75.75 0 011.061 0 6 6 0 010 8.486.75.75 0 01-1.06-1.061 4.5 4.5 0 000-6.364.75.75 0 010-1.06z" /></svg>
                                </button>
                                <span class="text-[13px] text-slate-400 font-medium">点击卡片看释义与语境</span>
                            </div>

                            <!-- 词典与双语溯源例句渲染区 -->
                            <div id="dict-area" class="w-full flex-1 flex-col items-center justify-start mt-1 hidden">
                                <span class="text-[11px] text-slate-300 animate-pulse tracking-wide py-4 text-center w-full block">📡 呼叫词典...</span>
                            </div>
                        </div>
                        
                        ${controlsHtml}
                    </div>
                `;

                playYoudaoAudio(currentWord);

                if (currentWord) {
                    const lowerWord = currentWord.toLowerCase();
                    if (dictCache[lowerWord]) {
                        parseAndRenderDict(dictCache[lowerWord], currentWord);
                    } else {
                        parseAndRenderDict(null, currentWord);
                        window.dispatchEvent(new CustomEvent('TM_Dict_Request', { detail: { word: currentWord } }));
                    }
                }
            }
        }

    </script>
</body>
</html>
