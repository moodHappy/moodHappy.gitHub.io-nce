<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GitHub WordSync Pro (纯血 FSRS 引擎版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #e2e8f0; border-radius: 20px; }
        
        /* 平滑折叠过渡效果 */
        .controls-container {
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease, margin 0.3s ease, padding 0.3s ease;
            max-height: 500px;
            opacity: 1;
            overflow: hidden;
        }
        .controls-container.collapsed {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
            margin-bottom: 0;
            padding-top: 0;
            padding-bottom: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-50 h-[100dvh] w-screen text-slate-800 flex flex-col font-sans overflow-hidden">
    
    <div id="controls-panel" class="controls-container flex flex-col shrink-0">
        
        <header class="bg-white shadow-sm border-b border-slate-100 z-10 shrink-0">
            <div class="max-w-4xl mx-auto px-3 sm:px-4 py-2.5 flex justify-between items-center flex-wrap gap-2">
                <h1 class="text-xl font-extrabold text-slate-900 flex items-center gap-1.5 tracking-tight">
                    <span>📚</span> WordSync <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded border border-blue-100 tracking-wider leading-none mt-0.5">PRO</span>
                </h1>
                <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
                    <button id="btn-trash" class="px-2.5 sm:px-3 py-1.5 text-xs sm:text-sm bg-orange-50 hover:bg-orange-100 border border-orange-200 text-orange-600 rounded-xl transition font-bold shadow-sm flex items-center gap-1">
                        ♻️<span class="hidden sm:inline">恢复站</span><span id="trash-count" class="bg-orange-500 text-white font-extrabold px-1.5 rounded-full text-[10px] min-w-[1.25rem] text-center">0</span>
                    </button>
                    <button id="btn-settings" class="px-2.5 sm:px-3 py-1.5 text-xs sm:text-sm bg-slate-100 hover:bg-slate-200 border border-slate-200 rounded-xl transition font-medium shadow-sm">⚙️<span class="hidden sm:inline">配置</span></button>
                    
                    <button id="btn-sync-sm2" class="px-2.5 sm:px-3 py-1.5 text-xs sm:text-sm bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-700 rounded-xl transition font-bold shadow-sm flex items-center gap-1">
                        💾 备份进度
                    </button>

                    <button id="btn-sync" class="px-2.5 sm:px-3 py-1.5 text-xs sm:text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition font-semibold shadow-md disabled:opacity-50 disabled:shadow-none" disabled>☁️ 同步词库</button>
                </div>
            </div>
        </header>

        <div class="w-full bg-slate-50 py-2.5 shrink-0">
            <div class="max-w-4xl mx-auto px-3 sm:px-4 flex flex-col gap-2">
                <div class="flex gap-2 w-full">
                    <div class="relative flex-1">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="text-slate-400 text-sm">🔍</span>
                        </div>
                        <input type="text" id="search-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="快速检索..." class="w-full pl-9 pr-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none shadow-sm transition min-w-0 font-medium">
                    </div>
                    <button id="btn-toggle-confirm" class="px-3 py-2 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-xl text-sm font-bold shadow-sm transition flex items-center justify-center whitespace-nowrap active:scale-95">
                    </button>
                    <button id="btn-reload" class="px-3 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 rounded-xl text-sm font-bold shadow-sm transition flex items-center justify-center active:scale-95" aria-label="强制拉取">
                        🔄
                    </button>
                </div>
                
                <div class="grid grid-cols-4 bg-white border border-slate-200 p-1 rounded-xl shadow-sm gap-1 w-full relative z-0">
                    <button class="mode-btn py-1.5 rounded-lg text-xs sm:text-sm font-bold transition flex justify-center items-center gap-1 text-slate-600 hover:bg-slate-100" data-mode="list">
                        <span class="text-sm leading-none">📋</span> <span>列表</span>
                    </button>
                    <button class="mode-btn py-1.5 rounded-lg text-xs sm:text-sm font-bold transition flex justify-center items-center gap-1 text-slate-600 hover:bg-slate-100" data-mode="card_seq">
                        <span class="text-sm leading-none">📇</span> <span>顺序</span>
                    </button>
                    <button class="mode-btn py-1.5 rounded-lg text-xs sm:text-sm font-bold transition flex justify-center items-center gap-1 text-slate-600 hover:bg-slate-100" data-mode="card_rand">
                        <span class="text-sm leading-none">🔀</span> <span>随机</span>
                    </button>
                    <button class="mode-btn py-1.5 rounded-lg text-xs sm:text-sm font-bold transition flex justify-center items-center gap-1 text-slate-600 hover:bg-slate-100 relative" data-mode="fsrs">
                        <span class="text-sm leading-none">🧠</span> <span>FSRS</span>
                        <span id="fsrs-badge" class="hidden absolute top-0 right-0 sm:-top-1 sm:-right-1 bg-red-500 text-white text-[9px] px-1.5 py-0.5 rounded-full shadow-sm border border-white leading-none transform translate-x-1 -translate-y-1">0</span>
                    </button>
                </div>
                
                <div class="flex items-center justify-between px-1">
                    <div class="flex items-center gap-2">
                        <span id="today-count" class="text-[11px] bg-white border border-slate-200 text-slate-500 px-2 py-0.5 rounded font-bold shadow-sm">今日已删: 0</span>
                        <span id="word-count" class="text-[11px] bg-white border border-slate-200 text-slate-500 px-2 py-0.5 rounded font-bold shadow-sm">剩余: 0</span>
                    </div>
                    <span class="text-[10px] text-slate-400 font-medium tracking-wide">💡 双击卡片区全屏</span>
                </div>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-extrabold text-slate-800">数据库与 API 配置</h2>
                <button id="close-settings" class="text-slate-400 hover:text-red-500 bg-slate-100 hover:bg-red-50 rounded-full w-8 h-8 flex items-center justify-center transition font-bold">&times;</button>
            </div>
            <p class="text-xs text-slate-500 bg-blue-50 text-blue-700 p-3 rounded-xl border border-blue-100">
                支持单词表与 FSRS 学习进度双向多设备云端备份。配合本地油猴脚本可获取跨域词典。
            </p>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">GitHub Token (PAT)</label>
                    <input type="password" id="cfg-token" autocomplete="new-password" spellcheck="false" placeholder="ghp_xxxxxxxxxxxx" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none transition">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">主库 Owner</label>
                        <input type="text" id="cfg-owner" autocomplete="off" spellcheck="false" value="moodHappy" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">主库 Repo</label>
                        <input type="text" id="cfg-repo" autocomplete="off" spellcheck="false" value="HelloWorld" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">主词库路径 (Featured1.txt)</label>
                    <input type="text" id="cfg-path" autocomplete="off" spellcheck="false" value="Notes/Featured1.txt" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">星标联动库路径 (one.txt)</label>
                    <input type="text" id="cfg-path-two" autocomplete="off" spellcheck="false" value="Notes/one.txt" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none transition">
                </div>
                <div class="border-t border-slate-100 pt-3">
                    <label class="block text-xs font-bold text-indigo-600 mb-1">备份存储库 (学习记录同步仓库)</label>
                    <input type="text" id="cfg-backup-repo" autocomplete="off" spellcheck="false" value="moodHappy.gitHub.io-nce" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none transition font-mono text-xs">
                </div>
                <div>
                    <label class="block text-xs font-bold text-indigo-600 mb-1">备份文件路径</label>
                    <input type="text" id="cfg-backup-path" autocomplete="off" spellcheck="false" value="config/fsrs_backup.json" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none transition font-mono text-xs">
                </div>
            </div>
            <div class="flex justify-end pt-2">
                <button id="btn-save-config" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-sm font-bold transition shadow-lg shadow-slate-200">保存并拉取云端全量数据</button>
            </div>
        </div>
    </div>

    <div id="trash-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity">
        <div class="bg-white rounded-3xl max-w-md w-full max-h-[80vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 shrink-0">
                <h2 class="text-lg font-extrabold text-slate-800 flex items-center gap-2">♻️ 回收恢复站</h2>
                <button id="close-trash" class="text-slate-400 hover:text-red-500 bg-white hover:bg-red-50 border border-slate-200 rounded-full w-8 h-8 flex items-center justify-center transition font-bold shadow-sm">&times;</button>
            </div>
            <div class="overflow-y-auto p-2 flex-1 min-h-0 bg-white custom-scrollbar" id="trash-list"></div>
        </div>
    </div>

    <main class="flex-1 w-full flex flex-col relative overflow-hidden bg-white sm:bg-slate-50">
        <div id="status-bar" class="hidden p-3 rounded-xl text-sm font-medium transition-all shadow-md absolute left-4 right-4 top-2 z-50 text-center pointer-events-none"></div>

        <div id="learning-container" class="w-full h-full max-w-4xl mx-auto sm:px-4 flex flex-col relative overflow-hidden select-none">
            <div id="word-list" class="w-full flex-1 min-h-0 flex flex-col">
                <div class="text-center py-20 text-blue-500 text-sm font-bold animate-pulse">
                    🚀 正在装载 FSRS 记忆引擎模块...
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        // ==========================================
        // 外部 FSRS 算法库加载与配置
        // ==========================================
        let FSRS_API = null;
        let fsrsEngine = null;
        try {
            // 通过 jsDelivr CDN 动态引入 ts-fsrs
            const module = await import('https://cdn.jsdelivr.net/npm/ts-fsrs@3.5.0/+esm');
            FSRS_API = module;
            fsrsEngine = module.fsrs(); // 实例化 FSRS 引擎
            console.log("🔥 成功加载并实例化外部顶尖 FSRS 记忆算法引擎!");
        } catch (err) {
            alert("加载外部 FSRS 库失败，请检查网络连接或更换代理环境。");
            console.error(err);
        }

        // ==========================================
        // 双击全屏沉浸逻辑
        // ==========================================
        const controlsPanel = document.getElementById('controls-panel');
        const learningContainer = document.getElementById('learning-container');
        
        learningContainer.addEventListener('dblclick', function(e) {
            if(e.target.tagName.toLowerCase() === 'button' || e.target.closest('button')) return;
            controlsPanel.classList.toggle('collapsed');
        });

        // ==========================================
        // IndexedDB 核心封装
        // ==========================================
        const DB_NAME = 'WordSyncProDB_Max_V7'; // 升级版本号清洗旧的SM2脏数据
        const DB_VERSION = 1;
        const STORE_APP = 'app_store';

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = e => {
                    if (!e.target.result.objectStoreNames.contains(STORE_APP)) e.target.result.createObjectStore(STORE_APP);
                };
                req.onsuccess = e => resolve(e.target.result);
                req.onerror = e => reject(e.target.error);
            });
        }
        async function idbGet(key) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const req = db.transaction(STORE_APP, 'readonly').objectStore(STORE_APP).get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }
        async function idbSet(key, val) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const req = db.transaction(STORE_APP, 'readwrite').objectStore(STORE_APP).put(val, key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        // ==========================================
        // 状态变量与缓存数据
        // ==========================================
        let words = [];             
        let displayWords = [];      
        let fileSha = '';           
        
        let oneWords = [];          
        let oneFileSha = '';        
        let oneTxtSet = new Set();  
        
        let backupFileSha = '';     
        let memoryStats = {};       // FSRS 核心状态库
        let trash = []; 
        
        let currentFilter = '';
        let viewMode = 'list';      
        let currentCardIndex = 0;
        let confirmDeleteEnabled = true;

        const DOM = {
            btnSettings: document.getElementById('btn-settings'),
            modalSettings: document.getElementById('settings-modal'),
            btnCloseSettings: document.getElementById('close-settings'),
            btnSaveConfig: document.getElementById('btn-save-config'),
            btnSync: document.getElementById('btn-sync'),
            btnSyncSm2: document.getElementById('btn-sync-sm2'), 
            btnReload: document.getElementById('btn-reload'),
            btnToggleConfirm: document.getElementById('btn-toggle-confirm'),
            
            btnTrash: document.getElementById('btn-trash'),
            modalTrash: document.getElementById('trash-modal'),
            btnCloseTrash: document.getElementById('close-trash'),
            trashList: document.getElementById('trash-list'),
            trashCount: document.getElementById('trash-count'),
            
            modeBtns: document.querySelectorAll('.mode-btn'),
            wordListEl: document.getElementById('word-list'),
            wordCountEl: document.getElementById('word-count'),
            todayCountEl: document.getElementById('today-count'),
            fsrsBadge: document.getElementById('fsrs-badge'),
            searchInput: document.getElementById('search-input'),
            statusBar: document.getElementById('status-bar'),
            
            cfgToken: document.getElementById('cfg-token'),
            cfgOwner: document.getElementById('cfg-owner'),
            cfgRepo: document.getElementById('cfg-repo'),
            cfgPath: document.getElementById('cfg-path'),
            cfgPathTwo: document.getElementById('cfg-path-two'),
            cfgBackupRepo: document.getElementById('cfg-backup-repo'),
            cfgBackupPath: document.getElementById('cfg-backup-path')
        };

        // ==========================================
        // 跨域油猴词典监听 (有道解析)
        // ==========================================
        window.addEventListener('TM_Dict_Response', function(e) {
            const reqWord = e.detail.word;
            const data = e.detail.data;
            const currentWord = displayWords[currentCardIndex];
            
            if (reqWord !== currentWord || viewMode === 'list') return;
            
            const dictArea = document.getElementById('dict-area');
            if (!dictArea) return;

            if (!data) {
                dictArea.innerHTML = `<span class="text-xs text-slate-400 font-medium py-4">未找到释义或网络异常</span>`;
                return;
            }

            let phoneticHTML = '';
            let transHTML = '';
            
            try {
                let us = data?.ec?.word?.[0]?.usphone || data?.simple?.word?.[0]?.usphone || '';
                let uk = data?.ec?.word?.[0]?.ukphone || data?.simple?.word?.[0]?.ukphone || '';
                if (us || uk) {
                    phoneticHTML = `<div class="text-[11px] sm:text-xs text-slate-400 font-mono mb-2 flex gap-3 justify-center">
                        ${us ? `<span>US: [${us}]</span>` : ''} 
                        ${uk ? `<span>UK: [${uk}]</span>` : ''}
                    </div>`;
                }
                
                let trs = data?.ec?.word?.[0]?.trs;
                if (trs && trs.length > 0) {
                    transHTML = trs.map(t => t.tr?.[0]?.l?.i?.[0]).filter(Boolean).join('<br>');
                } else if (data?.web_trans?.web_translation?.[0]?.trans) {
                    transHTML = data.web_trans.web_translation.slice(0,3).map(t => t.trans.map(x=>x.value).join(',')).join('<br>');
                }
            } catch(err) {
                console.error("词典解析错误", err);
            }

            if (!transHTML) transHTML = "未匹配到具体释义";

            dictArea.innerHTML = `
                ${phoneticHTML}
                <div class="text-[13px] sm:text-sm font-medium text-slate-600 leading-relaxed text-center pb-2">${transHTML}</div>
            `;
        });

        // ==========================================
        // 初始化加载
        // ==========================================
        // 等待整个 DOM 解析并且 FSRS API 加载完成后再执行后续逻辑
        const config = await idbGet('config') || {
            token: '', owner: 'moodHappy', repo: 'HelloWorld', path: 'Notes/Featured1.txt', pathTwo: 'Notes/one.txt',
            backupRepo: 'moodHappy.gitHub.io-nce', backupPath: 'config/fsrs_backup.json', confirmDelete: true
        };
        DOM.cfgToken.value = config.token;
        DOM.cfgOwner.value = config.owner;
        DOM.cfgRepo.value = config.repo;
        DOM.cfgPath.value = config.path;
        DOM.cfgPathTwo.value = config.pathTwo || 'Notes/one.txt';
        DOM.cfgBackupRepo.value = config.backupRepo || 'moodHappy.gitHub.io-nce';
        DOM.cfgBackupPath.value = config.backupPath || 'config/fsrs_backup.json';
        
        confirmDeleteEnabled = config.confirmDelete !== undefined ? config.confirmDelete : true;
        updateConfirmButtonUI();
        await updateTodayCountDisplay(false, false);

        memoryStats = await idbGet('memory_stats') || {};
        trash = await idbGet('trash_bin') || [];
        
        const oneCache = await idbGet('one_cache');
        if (oneCache && oneCache.fileSha) {
            oneWords = oneCache.words || [];
            oneFileSha = oneCache.fileSha;
            oneTxtSet = new Set(oneWords.map(w => w.toLowerCase()));
        }

        const cached = await idbGet('words_cache');
        if (cached && cached.fileSha && FSRS_API) {
            words = cached.words || [];
            fileSha = cached.fileSha;
            switchMode('list');
            DOM.btnSync.removeAttribute('disabled');
            renderTrash();
        } else if (FSRS_API) {
            if (config.token) { loadWordsFromGitHub(); } 
            else {
                DOM.modalSettings.classList.remove('hidden');
                DOM.wordListEl.innerHTML = `<div class="text-center py-20 text-slate-400 text-sm flex flex-col items-center"><span class="text-4xl mb-2">⚙️</span><span>请先配置 API 获取词库</span></div>`;
            }
        }

        DOM.modeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => switchMode(e.currentTarget.dataset.mode));
        });

        function switchMode(newMode) {
            viewMode = newMode;
            DOM.modeBtns.forEach(btn => {
                if (btn.dataset.mode === viewMode) {
                    btn.classList.add('bg-slate-800', 'text-white', 'shadow-md');
                    btn.classList.remove('text-slate-600', 'hover:bg-slate-100');
                } else {
                    btn.classList.remove('bg-slate-800', 'text-white', 'shadow-md');
                    btn.classList.add('text-slate-600', 'hover:bg-slate-100');
                }
            });

            const filtered = words.filter(w => w.toLowerCase().includes(currentFilter.toLowerCase()));
            
            if (viewMode === 'list' || viewMode === 'card_seq') displayWords = [...filtered];
            else if (viewMode === 'card_rand') displayWords = shuffleArray([...filtered]);
            else if (viewMode === 'fsrs') {
                const now = Date.now();
                displayWords = filtered.filter(w => {
                    const card = memoryStats[w];
                    // 没有记录，或者 nextDate <= 现在，或者由于兼容性没有 nextDate 的统统挑出来
                    return !card || !card.nextDate || card.nextDate <= now;
                });
            }
            
            currentCardIndex = 0;
            renderWords();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // ==========================================
        // 配置与系统操作
        // ==========================================
        DOM.btnSaveConfig.addEventListener('click', async () => {
            const config = {
                token: DOM.cfgToken.value.trim(), owner: DOM.cfgOwner.value.trim(),
                repo: DOM.cfgRepo.value.trim(), path: DOM.cfgPath.value.trim(),
                pathTwo: DOM.cfgPathTwo.value.trim(),
                backupRepo: DOM.cfgBackupRepo.value.trim(),
                backupPath: DOM.cfgBackupPath.value.trim(),
                confirmDelete: confirmDeleteEnabled
            };
            if (!config.token) return alert('请填写 GitHub Token！');
            await idbSet('config', config);
            DOM.modalSettings.classList.add('hidden');
            loadWordsFromGitHub();
        });

        [DOM.btnSettings, DOM.btnCloseSettings].forEach(b => b.addEventListener('click', () => DOM.modalSettings.classList.toggle('hidden')));
        DOM.modalSettings.addEventListener('click', e => { if (e.target === DOM.modalSettings) DOM.modalSettings.classList.add('hidden'); });
        
        [DOM.btnTrash, DOM.btnCloseTrash].forEach(b => b.addEventListener('click', () => { renderTrash(); DOM.modalTrash.classList.toggle('hidden'); }));
        DOM.modalTrash.addEventListener('click', e => { if (e.target === DOM.modalTrash) DOM.modalTrash.classList.add('hidden'); });

        DOM.btnReload.addEventListener('click', loadWordsFromGitHub);
        DOM.searchInput.addEventListener('input', (e) => { currentFilter = e.target.value; switchMode(viewMode); });

        DOM.btnToggleConfirm.addEventListener('click', async () => {
            confirmDeleteEnabled = !confirmDeleteEnabled;
            updateConfirmButtonUI();
            const config = await idbGet('config') || {};
            config.confirmDelete = confirmDeleteEnabled;
            await idbSet('config', config);
        });

        function updateConfirmButtonUI() {
            if (confirmDeleteEnabled) {
                DOM.btnToggleConfirm.className = "px-3 py-2 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-xl text-sm font-bold shadow-sm transition flex items-center justify-center whitespace-nowrap active:scale-95";
                DOM.btnToggleConfirm.innerHTML = `<span class="text-base leading-none mr-1">🛡️</span> <span class="hidden sm:inline">删审:</span>开`;
            } else {
                DOM.btnToggleConfirm.className = "px-3 py-2 bg-slate-100 text-slate-500 border border-slate-200 hover:bg-slate-200 rounded-xl text-sm font-bold shadow-sm transition flex items-center justify-center whitespace-nowrap active:scale-95";
                DOM.btnToggleConfirm.innerHTML = `<span class="text-base leading-none mr-1">🔓</span> <span class="hidden sm:inline">删审:</span>关`;

        function showStatus(msg, type = 'info') {
            DOM.statusBar.className = `absolute left-4 right-4 top-2 z-50 text-center p-3 rounded-2xl text-sm font-bold transition-all shadow-md transform translate-y-2 ${
                type === 'success' ? 'bg-green-600 text-white' : type === 'error' ? 'bg-red-600 text-white' : 'bg-slate-800 text-white'
            }`;
            DOM.statusBar.textContent = msg;
            DOM.statusBar.classList.remove('hidden');
            setTimeout(() => { DOM.statusBar.classList.add('hidden'); }, 3000);
        }

        async function updateTodayCountDisplay(increment = false, decrement = false) {
            const todayStr = new Date().toISOString().slice(0, 10);
            let stats = await idbGet('stats') || { date: todayStr, count: 0 };
            if (stats.date !== todayStr) { stats.date = todayStr; stats.count = 0; }
            if (increment) stats.count++;
            if (decrement && stats.count > 0) stats.count--;
            await idbSet('stats', stats);
            DOM.todayCountEl.textContent = `今日已删: ${stats.count}`;
        }

        // ==========================================
        // GitHub API 交互与多设备云端备份
        // ==========================================
        function base64ToUtf8(base64) { try { return decodeURIComponent(Array.prototype.map.call(atob(base64), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')); } catch (e) { return atob(base64); } }
        function utf8ToBase64(str) { return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1))); }

        async function fetchGitHubFile(config, owner, repo, filepath) {
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${filepath}`;
            const res = await fetch(url, { headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3+json', 'If-None-Match': '' } });
            if (!res.ok) throw new Error(`请求 ${filepath} 失败: ${res.status}`);
            return await res.json();
        }

        async function loadWordsFromGitHub() {
            const config = await idbGet('config');
            if (!config || !config.token) return DOM.modalSettings.classList.remove('hidden');

            showStatus('🚀 正在拉取词库与云端记录...', 'info');
            DOM.wordListEl.innerHTML = `<div class="text-center py-20 text-blue-500 font-bold text-sm animate-pulse flex flex-col items-center"><span class="text-3xl mb-2">🔄</span>正在连接 GitHub 并同步数据...</div>`;

            try {
                const fetchPromises = [
                    fetchGitHubFile(config, config.owner, config.repo, config.path)
                ];
                if (config.pathTwo) fetchPromises.push(fetchGitHubFile(config, config.owner, config.repo, config.pathTwo).catch(e => null)); 
                if (config.backupRepo && config.backupPath) fetchPromises.push(fetchGitHubFile(config, config.owner, config.backupRepo, config.backupPath).catch(e => null));

                const results = await Promise.all(fetchPromises);
                const mainData = results[0];
                const oneData = results[1];
                const backupData = results[2];

                fileSha = mainData.sha;
                const content = base64ToUtf8(mainData.content);
                words = content.split(/\r?\n/).map(w => w.trim()).filter(w => w.length > 0);
                await idbSet('words_cache', { words, fileSha });

                if (oneData) {
                    const oneContent = base64ToUtf8(oneData.content);
                    oneWords = oneContent.split(/\r?\n/).map(w => w.trim()).filter(w => w.length > 0);
                    oneFileSha = oneData.sha;
                    await idbSet('one_cache', { words: oneWords, fileSha: oneFileSha });
                    await idbSet('one_dirty', false);
                    oneTxtSet = new Set(oneWords.map(w => w.toLowerCase()));
                }

                if (backupData) {
                    backupFileSha = backupData.sha;
                    const jsonStr = base64ToUtf8(backupData.content);
                    const backupJson = JSON.parse(jsonStr);
                    
                    if (backupJson.memoryStats) {
                        memoryStats = { ...memoryStats, ...backupJson.memoryStats };
                        await idbSet('memory_stats', memoryStats);
                    }
                    if (backupJson.trash && Array.isArray(backupJson.trash)) {
                        trash = backupJson.trash;
                        await idbSet('trash_bin', trash);
                        renderTrash();
                    }
                    if (backupJson.stats) {
                        await idbSet('stats', backupJson.stats);
                        await updateTodayCountDisplay(false, false);
                    }
                }

                showStatus(`全量同步成功！加载 ${words.length} 词`, 'success');
                DOM.btnSync.removeAttribute('disabled');
                switchMode(viewMode);
            } catch (err) {
                showStatus(`拉取失败: ${err.message}`, 'error');
                DOM.wordListEl.innerHTML = `<div class="text-center py-20 text-red-500 font-bold text-sm">加载失败: ${err.message}</div>`;
            }
        }

        // ==========================================
        // 核心：严格处理序列化及 FSRS 调度逻辑
        // ==========================================
        function getNextReviewTime(intervalDays) {
            // FSRS 如果判定当前就该复习（0天），则立刻锁定
            if (intervalDays <= 0) return Date.now(); 
            const now = new Date();
            const logicalNow = new Date(now.getTime() - 4 * 60 * 60 * 1000);
            logicalNow.setHours(0, 0, 0, 0);
            logicalNow.setDate(logicalNow.getDate() + intervalDays);
            return logicalNow.getTime() + 4 * 60 * 60 * 1000;
        }

        // 核心注水函数：将 JSON 中的死字符串转化为原生 Date
        function hydrateCard(raw) {
            if (!raw || !raw.due) return FSRS_API.createEmptyCard(new Date());
            let card = { ...raw };
            if (card.due) card.due = new Date(card.due);
            if (card.last_review) card.last_review = new Date(card.last_review);
            return card;
        }

        // 获取预测的间隔天数渲染在按钮上
        function getSimulatedInterval(word, gradeStr) {
            if (!FSRS_API) return "?";
            let card = hydrateCard(memoryStats[word]);
            let now = new Date();
            
            try {
                // ts-fsrs repeat 返回一个包含4种结果的 Record
                let scheduling_cards = fsrsEngine.repeat(card, now);
                // 1=Again, 2=Hard, 3=Good, 4=Easy
                let targetGrade = parseInt(gradeStr, 10);
                let scheduled_days = scheduling_cards[targetGrade].card.scheduled_days;
                return scheduled_days === 0 ? "今天" : `${scheduled_days}天`;
            } catch(e) {
                console.error(e);
                return "?";
            }
        }

        // 将该函数暴露给 window，方便 HTML 中的 onclick 调用
        window.rateWordFSRS = async function(word, qualityStr) {
            if (!FSRS_API) return showStatus("FSRS引擎异常", "error");
            
            let card = hydrateCard(memoryStats[word]);
            let now = new Date();
            let targetGrade = parseInt(qualityStr, 10);

            try {
                let scheduling_cards = fsrsEngine.repeat(card, now);
                let next_card = scheduling_cards[targetGrade].card;
                
                // 将计算出的科学间隔套用我们的 4 点逻辑
                next_card.nextDate = getNextReviewTime(next_card.scheduled_days);
                
                // 存回状态库
                memoryStats[word] = next_card;
                await idbSet('memory_stats', memoryStats);

                // 在界面中移除并跳向下一张
                displayWords.splice(currentCardIndex, 1);
                if (currentCardIndex >= displayWords.length) currentCardIndex = Math.max(0, displayWords.length - 1);
                
                renderWords();
                const msg = next_card.scheduled_days === 0 ? '🔴 稍后重来' : `${targetGrade === 2 ? '🟠' : targetGrade === 3 ? '🟢' : '🔵'} 已安排在 ${next_card.scheduled_days} 天后复习`;
                showStatus(msg, 'info');

            } catch (err) {
                showStatus(`打分计算失败: ${err.message}`, 'error');
            }
        }

        // ==========================================
        // 渲染 UI 与恢复站操作
        // ==========================================
        function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }

        function renderTrash() {
            DOM.trashCount.textContent = trash.length;
            if (trash.length === 0) {
                DOM.trashList.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm font-medium">回收站是空的</div>`;
                return;
            }
            DOM.trashList.innerHTML = trash.map((item, idx) => {
                const d = new Date(item.deletedAt);
                const timeStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
                return `
                    <div class="flex items-center justify-between p-3.5 mb-2 bg-slate-50 border border-slate-100 rounded-2xl hover:border-blue-200 transition">
                        <div class="flex flex-col truncate pr-2">
                            <span class="font-extrabold text-slate-700 text-sm truncate">${escapeHtml(item.word)}</span>
                            <span class="text-[10px] text-slate-400 mt-0.5">删于 ${timeStr} ${item.inOne ? '<span class="text-yellow-500 font-bold ml-1">★ 曾属星标</span>' : ''}</span>
                        </div>
                        <button onclick="restoreWord(${idx})" class="px-4 py-1.5 bg-green-50 text-green-700 hover:bg-green-500 hover:text-white rounded-xl text-xs font-extrabold shadow-sm transition active:scale-95">恢复</button>
                    </div>
                `;
            }).join('');
        }

        window.restoreWord = async function(index) {
            const item = trash[index];
            if (item.inMain) words.push(item.word);
            if (item.inOne) {
                oneWords.push(item.word);
                oneTxtSet.add(item.word.toLowerCase());
                await idbSet('one_dirty', true);
            }
            
            trash.splice(index, 1);
            await idbSet('trash_bin', trash);
            await idbSet('words_cache', { words, fileSha });
            await idbSet('one_cache', { words: oneWords, fileSha: oneFileSha });
            
            const todayStr = new Date().toISOString().slice(0, 10);
            const delStr = new Date(item.deletedAt).toISOString().slice(0, 10);
            if (todayStr === delStr) await updateTodayCountDisplay(false, true);
            
            renderTrash();
            switchMode(viewMode);
            showStatus(`已成功恢复 "${item.word}" 💊`, 'success');
        };

        window.removeWord = async function(wordTarget) {
            if (confirmDeleteEnabled && !confirm(`确认将 "${wordTarget}" 踢出词库吗？\n如果它是星标词，也会一并被踢出！`)) return;

            let inMain = false;
            let inOne = false;

            const mainIdx = words.indexOf(wordTarget);
            if (mainIdx > -1) { words.splice(mainIdx, 1); inMain = true; }

            const lowerTarget = wordTarget.toLowerCase();
            const oneIdx = oneWords.findIndex(w => w.toLowerCase() === lowerTarget);
            if (oneIdx > -1) {
                oneWords.splice(oneIdx, 1);
                oneTxtSet.delete(lowerTarget);
                inOne = true;
                await idbSet('one_dirty', true);
            }

            if (inMain || inOne) {
                trash.unshift({ word: wordTarget, inMain, inOne, deletedAt: Date.now() });
                await idbSet('trash_bin', trash);
                
                const displayIndex = displayWords.indexOf(wordTarget);
                if (displayIndex > -1) {
                    displayWords.splice(displayIndex, 1);
                    if (currentCardIndex >= displayWords.length) currentCardIndex--; 
                }

                await idbSet('words_cache', { words, fileSha });
                if (inOne) await idbSet('one_cache', { words: oneWords, fileSha: oneFileSha });
                await updateTodayCountDisplay(true, false);
                
                renderWords();
                renderTrash();
                DOM.trashCount.textContent = trash.length;
            }
        };

        window.prevCard = () => { if (currentCardIndex > 0) { currentCardIndex--; renderWords(); } };
        window.nextCard = () => { if (currentCardIndex < displayWords.length - 1) { currentCardIndex++; renderWords(); } };

        function renderWords() {
            DOM.wordCountEl.textContent = `剩余: ${words.length}`;
            
            const now = Date.now();
            const dueCount = words.filter(w => {
                const card = memoryStats[w];
                return !card || !card.nextDate || card.nextDate <= now;
            }).length;

            if (dueCount > 0) {
                DOM.fsrsBadge.textContent = dueCount > 99 ? '99+' : dueCount;
                DOM.fsrsBadge.classList.remove('hidden');
            } else { DOM.fsrsBadge.classList.add('hidden'); }

            if (displayWords.length === 0) {
                let emptyMsg = '没有找到匹配的单词。';
                if (viewMode === 'fsrs') emptyMsg = '🎉 太棒了！今天凌晨 4 点前该背的单词已全部消灭！\n可以去列表模式巡视一下~';
                DOM.wordListEl.innerHTML = `<div class="text-center py-20 text-slate-400 font-bold whitespace-pre-line leading-relaxed">${emptyMsg}</div>`;
                return;
            }

            if (currentCardIndex >= displayWords.length) currentCardIndex = Math.max(0, displayWords.length - 1);

            if (viewMode === 'list') {
                DOM.wordListEl.innerHTML = `
                    <div class="w-full flex-1 min-h-0 overflow-y-auto custom-scrollbar px-2 pb-24">
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 pt-2 sm:pt-0">
                            ${displayWords.map((word) => {
                                const isStar = oneTxtSet.has(word.toLowerCase());
                                return `
                                    <div class="flex items-center justify-between p-3.5 bg-slate-50 sm:bg-white sm:shadow-sm hover:bg-slate-100 border border-slate-200 rounded-2xl transition group relative overflow-hidden">
                                        <div class="flex flex-col truncate pr-2">
                                            <span class="font-extrabold text-slate-800 text-base truncate">${escapeHtml(word)}</span>
                                            ${isStar ? '<span class="text-[10px] text-yellow-500 tracking-widest leading-none mt-1">⭐⭐⭐⭐⭐</span>' : ''}
                                        </div>
                                        <button onclick="removeWord('${escapeHtml(word)}')" class="px-3 py-1.5 text-xs bg-red-50 border border-red-100 text-red-600 hover:bg-red-500 hover:text-white rounded-xl transition font-bold shrink-0 shadow-sm active:scale-95">
                                            删除
                                        </button>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            } else {
                const currentWord = displayWords[currentCardIndex];
                const isStar = oneTxtSet.has(currentWord.toLowerCase());
                
                let controlsHtml = '';
                if (viewMode === 'fsrs') {
                    // Rating mapping: 1=Again, 2=Hard, 3=Good, 4=Easy
                    const int1 = getSimulatedInterval(currentWord, 1);
                    const int2 = getSimulatedInterval(currentWord, 2);
                    const int3 = getSimulatedInterval(currentWord, 3);
                    const int4 = getSimulatedInterval(currentWord, 4);

                    controlsHtml = `
                        <div class="grid grid-cols-4 gap-2 w-full mt-3 shrink-0 px-1 sm:px-2">
                            <button onclick="rateWordFSRS('${escapeHtml(currentWord)}', 1)" class="flex flex-col items-center justify-center p-3 sm:py-4 bg-red-50 hover:bg-red-100 border border-red-100 rounded-2xl transition shadow-sm text-red-700 active:scale-95">
                                <span class="text-sm font-extrabold">重来</span><span class="text-[10px] opacity-70 mt-0.5">${int1}</span>
                            </button>
                            <button onclick="rateWordFSRS('${escapeHtml(currentWord)}', 2)" class="flex flex-col items-center justify-center p-3 sm:py-4 bg-orange-50 hover:bg-orange-100 border border-orange-100 rounded-2xl transition shadow-sm text-orange-700 active:scale-95">
                                <span class="text-sm font-extrabold">困难</span><span class="text-[10px] opacity-70 mt-0.5">${int2}</span>
                            </button>
                            <button onclick="rateWordFSRS('${escapeHtml(currentWord)}', 3)" class="flex flex-col items-center justify-center p-3 sm:py-4 bg-blue-50 hover:bg-blue-100 border border-blue-100 rounded-2xl transition shadow-sm text-blue-700 active:scale-95">
                                <span class="text-sm font-extrabold">良好</span><span class="text-[10px] opacity-70 mt-0.5">${int3}</span>
                            </button>
                            <button onclick="rateWordFSRS('${escapeHtml(currentWord)}', 4)" class="flex flex-col items-center justify-center p-3 sm:py-4 bg-green-50 hover:bg-green-100 border border-green-100 rounded-2xl transition shadow-sm text-green-700 active:scale-95">
                                <span class="text-sm font-extrabold">简单</span><span class="text-[10px] opacity-70 mt-0.5">${int4}</span>
                            </button>
                        </div>
                        <div class="mt-3 flex justify-center w-full pb-6 sm:pb-8 shrink-0">
                             <button onclick="removeWord('${escapeHtml(currentWord)}')" class="text-xs text-slate-400 hover:text-red-500 underline decoration-dotted transition p-2">永远剔除 (脱离星标库)</button>
                        </div>
                    `;
                } else {
                    controlsHtml = `
                        <div class="flex items-center gap-3 mt-3 w-full justify-center shrink-0 px-2 pb-6 sm:pb-8">
                            <button onclick="prevCard()" class="px-5 py-3.5 bg-slate-50 border border-slate-200 hover:bg-slate-100 rounded-2xl text-base font-extrabold transition shadow-sm active:scale-95">⬅️</button>
                            <button onclick="removeWord('${escapeHtml(currentWord)}')" class="flex-1 px-6 py-3.5 bg-red-50 text-red-600 border border-red-100 hover:bg-red-500 hover:text-white rounded-2xl text-sm font-extrabold transition shadow-sm active:scale-95">🗑️ 彻底删除</button>
                            <button onclick="nextCard()" class="px-5 py-3.5 bg-slate-50 border border-slate-200 hover:bg-slate-100 rounded-2xl text-base font-extrabold transition shadow-sm active:scale-95">➡️</button>
                        </div>

                DOM.wordListEl.innerHTML = `

                            <div class="text-[11px] font-bold text-slate-400 bg-slate-100/80 px-2.5 py-1 rounded-full backdrop-blur-sm shadow-sm">${viewMode === 'fsrs' ? '待复习' : '进度'} : ${currentCardIndex + 1} / ${displayWords.length}</div>
                        </div>
                        
                        <div class="w-full flex-1 min-h-0 bg-white border border-slate-200 shadow-sm sm:shadow-lg rounded-3xl p-5 sm:p-8 flex flex-col items-center justify-start relative transition-all overflow-y-auto custom-scrollbar">
                            
                            <span class="text-4xl sm:text-5xl font-black text-slate-900 tracking-tight text-center break-words select-all mb-4 mt-2 shrink-0">${escapeHtml(currentWord)}</span>
                            
                            <div id="dict-area" class="w-full text-center flex flex-col items-center justify-start mt-2">
                                <span class="text-[11px] text-slate-300 animate-pulse tracking-wide py-4">📡 呼叫词典...</span>

                        ${controlsHtml}

                if (currentWord) {
                    window.dispatchEvent(new CustomEvent('TM_Dict_Request', { detail: { word: currentWord } }));
                }
            }
        }

        // ==========================================
        // 云端同步逻辑
        // ==========================================
        
        DOM.btnSync.addEventListener('click', async () => {
            const config = await idbGet('config');
            if (!config || !config.token) return alert('请先配置 Token');
            if (!confirm(`准备更新云端词汇表。这将会覆盖远程的主词库与星标联动库，是否继续？`)) return;

            DOM.btnSync.setAttribute('disabled', 'true');
            showStatus('🚀 正在推送修改后的词库...', 'info');

            let syncSuccess = true;
            let msgs = [];

            try {
                const encMain = utf8ToBase64(words.join('\n') + '\n');
                const resMain = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.path}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
                    body: JSON.stringify({ message: `WordSync Pro: Sync Words (${new Date().toISOString().slice(0,10)})`, content: encMain, sha: fileSha })
                });
                if (!resMain.ok) throw new Error((await resMain.json()).message);
                const dataMain = await resMain.json();
                fileSha = dataMain.content.sha;
                await idbSet('words_cache', { words, fileSha });
                msgs.push('主库成功');
            } catch(err) { syncSuccess = false; msgs.push(`主库失败: ${err.message}`); }

            const isOneDirty = await idbGet('one_dirty');
            if (isOneDirty && config.pathTwo && oneFileSha) {
                try {
                    const encOne = utf8ToBase64(oneWords.join('\n') + '\n');
                    const resOne = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.pathTwo}`, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
                        body: JSON.stringify({ message: `WordSync Pro: Sync Starred (${new Date().toISOString().slice(0,10)})`, content: encOne, sha: oneFileSha })
                    });
                    if (!resOne.ok) throw new Error((await resOne.json()).message);
                    const dataOne = await resOne.json();
                    oneFileSha = dataOne.content.sha;
                    await idbSet('one_cache', { words: oneWords, fileSha: oneFileSha });
                    await idbSet('one_dirty', false);
                    msgs.push('星标库成功');
                } catch(err) { syncSuccess = false; msgs.push(`星标库失败: ${err.message}`); }
            }

            if (syncSuccess) { showStatus(`🎉 词库同步成功！(${msgs.join(', ')})`, 'success'); } 
            else { showStatus(`⚠ 同步存在异常: ${msgs.join(' | ')}`, 'error'); }
            
            DOM.btnSync.removeAttribute('disabled');
        });

        DOM.btnSyncSm2.addEventListener('click', async () => {
            const config = await idbGet('config');
            if (!config || !config.token) return alert('请先配置 Token');
            if (!config.backupRepo || !config.backupPath) return alert('请在配置中心填写正确的备份仓库与路径。');

            DOM.btnSyncSm2.setAttribute('disabled', 'true');
            showStatus('🚀 正在备份 FSRS 进度与数据到云端...', 'info');

            try {
                const todayStats = await idbGet('stats');
                const backupPayload = JSON.stringify({
                    updatedAt: Date.now(),
                    memoryStats: memoryStats, 
                    trash: trash,
                    stats: todayStats
                }, null, 2);
                
                const encBackup = utf8ToBase64(backupPayload);
                const putBody = {
                    message: `WordSync Pro: Backup Study Record (${new Date().toISOString().slice(0,10)})`,
                    content: encBackup
                };
                if (backupFileSha) putBody.sha = backupFileSha; 

                const resBackup = await fetch(`https://api.github.com/repos/${config.owner}/${config.backupRepo}/contents/${config.backupPath}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
                    body: JSON.stringify(putBody)
                });
                
                if (!resBackup.ok) throw new Error((await resBackup.json()).message);
                const dataBackup = await resBackup.json();
                backupFileSha = dataBackup.content.sha;
                
                showStatus('🎉 记忆记录与进度备份成功！', 'success');
            } catch(err) { 
                showStatus(`备份失败: ${err.message}`, 'error'); 
            } finally {
                DOM.btnSyncSm2.removeAttribute('disabled');
            }
        });

    </script>
</body>
</html>
