<!DOCTYPE html>
<html lang="zh-CN" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="google" content="notranslate" />
  <title>Anki 句型笔记浏览器 Pro</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background-color: #F4F1EA;
      transition: background-color 0.25s ease;
    }
  </style>
</head>
<body>
  <div id="anki-viewer-root" data-relingo-block="true" notranslate></div>

  <template id="viewer-styles">
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .spin {
        animation: spin 0.9s linear infinite;
      }

      .app-shell {
        --bg-page: #F4F1EA;
        --bg-header: rgba(244, 241, 234, 0.86);
        --bg-card: #FFFFFF;
        --bg-sub: #F7F5F0;
        --bg-accent: #E8EFE9;
        --text-main: #1E201D;
        --text-secondary: #4A4E48;
        --text-muted: #787A73;
        --border-soft: #E5E0D5;
        --border-hover: #C8C1B2;
        --primary: #2F5C46;
        --primary-hover: #244836;
        --primary-soft: #E3EDE7;
        --fav-color: #D97706;
        --fav-bg: #FEF3C7;
        --lucky-color: #7C3AED;
        --lucky-bg: #EDE9FE;
        --highlight-bg: #FDE68A;
        --highlight-text: #78350F;
        --online-color: #059669;
        --offline-color: #D97706;

        --rating-s: #B45309;
        --rating-s-bg: linear-gradient(135deg, #FEF3C7, #FDE68A);
        --rating-a: #1D4ED8;
        --rating-a-bg: linear-gradient(135deg, #DBEAFE, #BFDBFE);
        --rating-b: #047857;
        --rating-b-bg: linear-gradient(135deg, #D1FAE5, #A7F3D0);
        --rating-other: #4B5563;
        --rating-other-bg: #E5E7EB;

        --shadow-card: 0 2px 10px rgba(30, 32, 29, 0.04), 0 1px 2px rgba(30, 32, 29, 0.03);
        --shadow-card-hover: 0 10px 24px rgba(30, 32, 29, 0.08), 0 2px 6px rgba(30, 32, 29, 0.04);

        min-height: 100vh;
        width: 100%;
        background-color: var(--bg-page);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.25s ease, color 0.25s ease;
        padding-bottom: 48px;
      }

      .app-shell.theme-dark {
        --bg-page: #141615;
        --bg-header: rgba(20, 22, 21, 0.86);
        --bg-card: #1E211F;
        --bg-sub: #262A27;
        --bg-accent: #22332A;
        --text-main: #ECEEEB;
        --text-secondary: #C2C7C0;
        --text-muted: #8C928A;
        --border-soft: #2E3330;
        --border-hover: #424A45;
        --primary: #529B76;
        --primary-hover: #64B089;
        --primary-soft: #22382C;
        --fav-color: #FBBF24;
        --fav-bg: rgba(245, 158, 11, 0.16);
        --lucky-color: #C4B5FD;
        --lucky-bg: rgba(139, 92, 246, 0.2);
        --highlight-bg: rgba(251, 191, 36, 0.28);
        --highlight-text: #FDE68A;
        --online-color: #34D399;
        --offline-color: #FBBF24;

        --rating-s: #FCD34D;
        --rating-s-bg: rgba(217, 119, 6, 0.22);
        --rating-a: #93C5FD;
        --rating-a-bg: rgba(37, 99, 235, 0.22);
        --rating-b: #6EE7B7;
        --rating-b-bg: rgba(5, 150, 105, 0.22);
        --rating-other: #D1D5DB;
        --rating-other-bg: #374151;

        --shadow-card: 0 2px 10px rgba(0, 0, 0, 0.24);
        --shadow-card-hover: 0 12px 26px rgba(0, 0, 0, 0.36);
      }

      /* 顶栏 */
      .app-header {
        position: sticky;
        top: 0;
        z-index: 60;
        background: var(--bg-header);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border-soft);
      }

      .header-inner {
        max-width: 1120px;
        margin: 0 auto;
        padding: 12px 16px 10px;
      }

      .header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }

      .brand-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-logo {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--primary), #498265);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 3px 8px rgba(47, 92, 70, 0.25);
        flex-shrink: 0;
      }

      .app-title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .count-badge {
        font-size: 12px;
        font-weight: 600;
        background: var(--primary-soft);
        color: var(--primary);
        padding: 2px 9px;
        border-radius: 999px;
        letter-spacing: 0;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
      }

      .btn {
        appearance: none;
        border: 1px solid var(--border-soft);
        background: var(--bg-card);
        color: var(--text-main);
        font-size: 13px;
        font-weight: 600;
        height: 34px;
        padding: 0 11px;
        border-radius: 10px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        transition: all 0.18s ease;
        white-space: nowrap;
      }

      .btn:hover:not(:disabled) {
        border-color: var(--border-hover);
        background: var(--bg-sub);
      }

      .btn:active:not(:disabled) {
        transform: scale(0.96);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .btn-icon-only {
        width: 34px;
        padding: 0;
      }

      .btn-primary {
        background: var(--primary);
        color: #FFFFFF;
        border-color: var(--primary);
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--primary-hover);
        border-color: var(--primary-hover);
        color: #FFFFFF;
      }

      .btn-active {
        background: var(--primary-soft);
        border-color: var(--primary);
        color: var(--primary);
      }

      .btn-lucky.active {
        background: var(--lucky-bg);
        border-color: var(--lucky-color);
        color: var(--lucky-color);
      }

      .btn-lucky.active:hover:not(:disabled) {
        background: var(--lucky-bg);
        border-color: var(--lucky-color);
        color: var(--lucky-color);
      }

      /* 搜索与收藏快捷区 */
      .search-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }

      .search-box {
        position: relative;
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
      }

      .search-icon {
        position: absolute;
        left: 12px;
        color: var(--text-muted);
        pointer-events: none;
        display: flex;
      }

      .search-input {
        width: 100%;
        height: 40px;
        padding: 0 36px 0 38px;
        border: 1px solid var(--border-soft);
        border-radius: 12px;
        background: var(--bg-card);
        color: var(--text-main);
        font-size: 14px;
        outline: none;
        transition: border-color 0.18s, box-shadow 0.18s;
      }

      .search-input::placeholder {
        color: var(--text-muted);
      }

      .search-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-soft);
      }

      .search-clear {
        position: absolute;
        right: 8px;
        width: 24px;
        height: 24px;
        border: none;
        background: var(--bg-sub);
        color: var(--text-muted);
        border-radius: 50%;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 0;
        transition: background 0.15s, color 0.15s;
      }

      .search-clear.visible {
        display: flex;
      }

      .search-clear:hover {
        background: var(--border-soft);
        color: var(--text-main);
      }

      .fav-filter-btn {
        height: 40px;
        padding: 0 13px;
        border-radius: 12px;
        border: 1px solid var(--border-soft);
        background: var(--bg-card);
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        transition: all 0.18s ease;
      }

      .fav-filter-btn:hover {
        border-color: var(--border-hover);
      }

      .fav-filter-btn.active {
        background: var(--fav-bg);
        border-color: var(--fav-color);
        color: var(--fav-color);
      }

      .fav-count-pill {
        font-size: 11px;
        padding: 1px 6px;
        border-radius: 999px;
        background: var(--bg-sub);
        color: var(--text-muted);
      }

      .fav-filter-btn.active .fav-count-pill {
        background: rgba(217, 119, 6, 0.18);
        color: var(--fav-color);
      }

      /* 筛选标签滚动条 */
      .filter-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .filter-scroll {
        display: flex;
        align-items: center;
        gap: 6px;
        overflow-x: auto;
        padding: 2px 0;
        scrollbar-width: none;
        flex: 1;
      }

      .filter-scroll::-webkit-scrollbar {
        display: none;
      }

      .chip {
        flex-shrink: 0;
        font-size: 12px;
        font-weight: 500;
        padding: 5px 12px;
        border-radius: 999px;
        border: 1px solid var(--border-soft);
        background: var(--bg-card);
        color: var(--text-secondary);
        cursor: pointer;
        user-select: none;
        transition: all 0.15s ease;
      }

      .chip:hover {
        border-color: var(--border-hover);
        color: var(--text-main);
      }

      .chip.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
        font-weight: 600;
      }

      .chip-divider {
        width: 1px;
        height: 16px;
        background: var(--border-soft);
        flex-shrink: 0;
        margin: 0 2px;
      }

      /* 主内容容器 */
      .main-container {
        max-width: 1120px;
        margin: 0 auto;
        padding: 14px 16px 0;
      }

      /* 通知 Toast */
      .toast-container {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        z-index: 100;
        background: var(--text-main);
        color: var(--bg-page);
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 500;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s ease, transform 0.22s ease;
        white-space: nowrap;
        max-width: 90vw;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .toast-container.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* 信息状态栏 */
      .status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
        font-size: 12.5px;
        color: var(--text-muted);
      }

      .status-left {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }

      .offline-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--bg-card);
        border: 1px solid var(--border-soft);
        font-size: 11.5px;
        font-weight: 500;
        color: var(--text-secondary);
      }

      .lucky-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 9px;
        border-radius: 999px;
        background: var(--lucky-bg);
        color: var(--lucky-color);
        font-size: 11.5px;
        font-weight: 600;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--online-color);
        flex-shrink: 0;
      }

      .status-dot.offline {
        background: var(--offline-color);
      }

      .status-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .text-link-btn {
        border: none;
        background: none;
        color: var(--primary);
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .text-link-btn:hover {
        background: var(--primary-soft);
      }

      .text-link-btn.lucky-link {
        color: var(--lucky-color);
      }

      .text-link-btn.lucky-link:hover {
        background: var(--lucky-bg);
      }

      /* 卡片网格 */
      .card-list {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;
      }

      @media (min-width: 780px) {
        .card-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px;
        }
      }

      /* 笔记卡片 */
      .note-card {
        background: var(--bg-card);
        border: 1px solid var(--border-soft);
        border-radius: 16px;
        padding: 18px;
        box-shadow: var(--shadow-card);
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        position: relative;
      }

      .note-card:hover {
        box-shadow: var(--shadow-card-hover);
        border-color: var(--border-hover);
      }

      .note-card.is-fav {
        border-color: rgba(217, 119, 6, 0.35);
      }

      .card-meta {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }

      .meta-left {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        padding-top: 2px;
      }

      .card-index {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }

      .rating-pill {
        font-size: 11.5px;
        font-weight: 700;
        padding: 2px 9px;
        border-radius: 6px;
        letter-spacing: 0.4px;
      }

      .rating-S { background: var(--rating-s-bg); color: var(--rating-s); }
      .rating-A { background: var(--rating-a-bg); color: var(--rating-a); }
      .rating-B { background: var(--rating-b-bg); color: var(--rating-b); }
      .rating-other { background: var(--rating-other-bg); color: var(--rating-other); }

      .deck-tag {
        font-size: 11.5px;
        color: var(--text-secondary);
        background: var(--bg-sub);
        padding: 2px 8px;
        border-radius: 6px;
        font-weight: 500;
      }

      .tag-item {
        font-size: 11.5px;
        color: var(--primary);
        background: var(--primary-soft);
        padding: 2px 8px;
        border-radius: 6px;
        font-weight: 500;
      }

      .card-actions {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
      }

      .action-icon-btn {
        border: 1px solid transparent;
        background: var(--bg-sub);
        color: var(--text-secondary);
        border-radius: 9px;
        height: 30px;
        padding: 0 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        transition: all 0.16s ease;
      }

      .action-icon-btn:hover {
        background: var(--primary-soft);
        color: var(--primary);
      }

      .action-icon-btn:active {
        transform: scale(0.92);
      }

      .fav-btn {
        width: 30px;
        padding: 0;
      }

      .fav-btn.active {
        background: var(--fav-bg);
        color: var(--fav-color);
        border-color: rgba(217, 119, 6, 0.25);
      }

      .fav-btn.active svg {
        fill: currentColor;
      }

      /* 句型主标题 */
      .pattern-text {
        font-size: 20px;
        font-weight: 700;
        color: var(--text-main);
        line-height: 1.42;
        letter-spacing: -0.01em;
        word-break: break-word;
      }

      /* 讲解块 */
      .field-block {
        background: var(--bg-sub);
        border-radius: 11px;
        padding: 11px 13px;
      }

      .field-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-muted);
        margin-bottom: 4px;
      }

      .field-content {
        font-size: 14.5px;
        color: var(--text-secondary);
        word-break: break-word;
      }

      /* 例句块 */
      .example-box {
        border-left: 3px solid var(--primary);
        padding: 2px 0 2px 12px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .example-en-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }

      .example-en {
        font-size: 15.5px;
        font-weight: 600;
        color: var(--text-main);
        line-height: 1.48;
        word-break: break-word;
      }

      .example-zh {
        font-size: 14px;
        color: var(--text-muted);
        line-height: 1.5;
      }

      /* 搜索词高亮 */
      mark.search-hl {
        background: var(--highlight-bg);
        color: var(--highlight-text);
        border-radius: 3px;
        padding: 0 2px;
        font-weight: 600;
      }

      /* 背诵遮罩 */
      .blur-mode .spoiler {
        filter: blur(6px);
        user-select: none;
        cursor: pointer;
        transition: filter 0.22s ease;
      }

      .blur-mode .spoiler:hover {
        filter: blur(4px);
      }

      .blur-mode .spoiler.revealed {
        filter: none;
        user-select: text;
      }

      /* 分页栏 */
      .pagination-bar {
        margin-top: 24px;
        padding: 12px 14px;
        background: var(--bg-card);
        border: 1px solid var(--border-soft);
        border-radius: 14px;
        box-shadow: var(--shadow-card);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }

      .page-info {
        font-size: 13px;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }

      .page-info strong {
        color: var(--text-main);
      }

      .page-controls {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
      }

      .page-btn {
        min-width: 34px;
        height: 34px;
        padding: 0 9px;
        border-radius: 9px;
        border: 1px solid var(--border-soft);
        background: var(--bg-sub);
        color: var(--text-main);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
        font-variant-numeric: tabular-nums;
      }

      .page-btn:hover:not(:disabled) {
        border-color: var(--primary);
        color: var(--primary);
        background: var(--primary-soft);
      }

      .page-btn.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #FFFFFF;
      }

      .page-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .page-ellipsis {
        color: var(--text-muted);
        font-size: 13px;
        padding: 0 4px;
        user-select: none;
      }

      /* 空状态 */
      .empty-state {
        grid-column: 1 / -1;
        background: var(--bg-card);
        border: 1px dashed var(--border-hover);
        border-radius: 16px;
        text-align: center;
        padding: 52px 20px;
        color: var(--text-muted);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .empty-icon {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: var(--bg-sub);
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 4px;
      }

      .empty-title {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-main);
      }

      .empty-desc {
        font-size: 13.5px;
        max-width: 380px;
      }

      @media (max-width: 580px) {
        .btn-label-hide-sm {
          display: none;
        }
        .pagination-bar {
          justify-content: center;
        }
      }
    </style>
  </template>

  <script>
    (function () {
      const REMOTE_URL = "https://raw.githubusercontent.com/moodHappy/moodHappy.gitHub.io-nce/refs/heads/main/config/Spoken.json";
      const DB_NAME = "anki_pattern_offline_db_v1";

      // IndexedDB 离线缓存封装（支持大容量 JSON，突破 localStorage 5MB 限制）
      const OfflineDB = {
        open() {
          return new Promise((resolve, reject) => {
            if (!("indexedDB" in window)) {
              reject(new Error("IndexedDB unavailable"));
              return;
            }
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains(DB_STORE)) {
                db.createObjectStore(DB_STORE);
              }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
          });
        },
        async get(key) {
          try {
            const db = await this.open();
            return await new Promise((resolve, reject) => {
              const tx = db.transaction(DB_STORE, "readonly");
              const req = tx.objectStore(DB_STORE).get(key);
              req.onsuccess = () => resolve(req.result);
              req.onerror = () => reject(req.error);
            });
          } catch (e) {
            return null;
          }
        },
        async set(key, value) {
          try {
            const db = await this.open();
            return await new Promise((resolve, reject) => {
              const tx = db.transaction(DB_STORE, "readwrite");
              const req = tx.objectStore(DB_STORE).put(value, key);
              req.onsuccess = () => resolve(true);
              req.onerror = () => reject(req.error);
            });
          } catch (e) {
            return false;
          }
        }
      };

      function stripHtml(html) {
        const div = document.createElement("div");
        div.innerHTML = String(html || "").replace(/\[sound:[^\]]*\]/gi, "");
        return (div.textContent || div.innerText || "").replace(/\s+/g, " ").trim();
      }

      function sanitizeField(val) {
        if (!val) return "";
        return String(val)
          .replace(/<script[\s\S]*?>[\s\S]*?<\/script>/gi, "")
          .replace(/on\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, "");
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function escapeAttr(str) {
        return escapeHtml(str).replace(/'/g, "&#39;");
      }

      function speakUS(text) {
        if (!text || !("speechSynthesis" in window)) {
          showToast("当前浏览器不支持语音朗读");
          return;
        }
        window.speechSynthesis.cancel();
        const plain = stripHtml(text);
        if (!plain) return;
        const utter = new SpeechSynthesisUtterance(plain);
        utter.lang = "en-US";
        utter.rate = 0.95;
        const voices = window.speechSynthesis.getVoices();
        const usVoice =
          voices.find(v => v.lang === "en-US" && !v.localService) ||
          voices.find(v => v.lang.startsWith("en-US"));
        if (usVoice) utter.voice = usVoice;
        window.speechSynthesis.speak(utter);
      }

      function copyText(text) {
        if (!text) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            showToast("已复制到剪贴板");
          }).catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand("copy");
          showToast("已复制到剪贴板");
        } catch (e) {
          showToast("复制失败，请手动选择复制");
        }
        document.body.removeChild(ta);
      }

      function extractNotesArray(json) {
        if (Array.isArray(json)) return json;
        if (json && Array.isArray(json.notes)) return json.notes;
        if (json && Array.isArray(json.data)) return json.data;
        return null;
      }

      function setSyncUI(syncing) {
        isSyncing = syncing;
        el.syncRemoteBtn.disabled = syncing;
        const svg = el.syncIconWrap.querySelector("svg");
        if (svg) svg.classList.toggle("spin", syncing);
        el.syncLabel.textContent = syncing ? "同步中..." : "同步远程";
      }

      // 随机抽取 3 条笔记来学习（优先避开上一轮刚抽到的卡片）
      function shuffleArray(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function pickLuckyThree() {
        if (!allNotes || allNotes.length === 0) {
          showToast("当前没有可供抽取的笔记");
          return;
        }
        const prevKeys = new Set((state.luckyNotes || []).map(getNoteKey));
        const freshPool = allNotes.filter(n => !prevKeys.has(getNoteKey(n)));
        let picked;
        if (freshPool.length >= 3) {
          picked = shuffleArray(freshPool).slice(0, 3);
        } else {
          const remainder = shuffleArray(allNotes.filter(n => prevKeys.has(getNoteKey(n))));
          picked = [...shuffleArray(freshPool), ...remainder].slice(0, Math.min(3, allNotes.length));
        }

        state.luckyNotes = picked;
        state.page = 1;
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
        showToast(`🎲 已为你随机抽取 ${picked.length} 条句型，开始学习吧！`);
      }

      // 远程拉取并缓存到本地（支持离线可用）
      async function syncRemoteData(isAutoBoot = false) {
        if (isSyncing) return;
        if (!navigator.onLine) {
          if (!isAutoBoot) {
            showToast("当前处于离线状态，已使用本地离线缓存");
          }
          renderAll();
          return;
        }

        setSyncUI(true);
        try {
          const res = await fetch(REMOTE_URL, { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const rawJson = await res.json();
          const notes = extractNotesArray(rawJson);
          if (!notes) throw new Error("远程 JSON 格式不是有效的笔记数组");

          allNotes = notes;
          state.rating = "ALL";
          state.tag = "ALL";
          state.onlyFav = false;
          state.luckyNotes = null;
          state.page = 1;
          await saveOfflineNotes(allNotes, "remote");
          renderAll();
          showToast(`远程同步成功，已离线缓存 ${allNotes.length} 条笔记！`);
        } catch (err) {
          if (!isAutoBoot) {
            showToast("远程同步失败，已保留本地缓存：" + err.message);
          }
          renderAll();
        } finally {
          setSyncUI(false);
        }
      }

      function getFilteredNotes() {
        const q = state.search.trim().toLowerCase();
        return allNotes.filter(item => {
          const key = getNoteKey(item);
          if (state.onlyFav && !favSet.has(key)) return false;

          const r = (item["Rating"] || "").trim().toUpperCase() || "无";
          if (state.rating !== "ALL" && r !== state.rating) return false;

          const tags = Array.isArray(item.tags) ? item.tags : [];
          if (state.tag !== "ALL" && !tags.includes(state.tag)) return false;

          if (!q) return true;
          const haystack = [
            item["句型"],
            item["讲解"],
            item["例句"],
            item["翻译"],
            item.deckName,
            tags.join(" ")
          ].join(" ").toLowerCase();
          return haystack.includes(q);
        });
      }

      function getCurrentDatasetFavCount() {
        let count = 0;
        for (const n of allNotes) {
          if (favSet.has(getNoteKey(n))) count++;
        }
        return count;
      }

      function highlightMatches(rootEl, keyword) {
        const q = keyword.trim();
        if (!q || !rootEl) return;
        const lowerQ = q.toLowerCase();
        const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null);
        const textNodes = [];
        let node;
        while ((node = walker.nextNode())) {
          if (node.nodeValue && node.nodeValue.toLowerCase().includes(lowerQ)) {
            textNodes.push(node);
          }
        }
        textNodes.forEach(tNode => {
          const val = tNode.nodeValue;
          const lowerVal = val.toLowerCase();
          const frag = document.createDocumentFragment();
          let lastIdx = 0;
          let idx = lowerVal.indexOf(lowerQ, lastIdx);
          while (idx !== -1) {
            if (idx > lastIdx) {
              frag.appendChild(document.createTextNode(val.slice(lastIdx, idx)));
            }
            const mark = document.createElement("mark");
            mark.className = "search-hl";
            mark.textContent = val.slice(idx, idx + q.length);
            frag.appendChild(mark);
            lastIdx = idx + q.length;
            idx = lowerVal.indexOf(lowerQ, lastIdx);
          }
          if (lastIdx < val.length) {
            frag.appendChild(document.createTextNode(val.slice(lastIdx)));
          }
          tNode.parentNode.replaceChild(frag, tNode);
        });
      }

      function renderFilters() {
        const ratings = ["ALL", ...new Set(allNotes.map(n => (n["Rating"] || "").trim().toUpperCase() || "无"))];
        const allTags = [...new Set(allNotes.flatMap(n => Array.isArray(n.tags) ? n.tags : []))];

        let html = ratings.map(r => `
          <span class="chip ${!state.luckyNotes && state.rating === r ? "active" : ""}" data-rating="${escapeAttr(r)}">
            ${r === "ALL" ? "全部等级" : "Rating " + escapeHtml(r)}
          </span>
        `).join("");

        if (allTags.length > 0) {
          html += `<span class="chip-divider"></span>`;
          html += allTags.map(t => `
            <span class="chip ${!state.luckyNotes && state.tag === t ? "active" : ""}" data-tag="${escapeAttr(t)}">
              #${escapeHtml(t)}
            </span>
          `).join("");
        }

        el.filterRow.innerHTML = html;
      }

      function renderCard(note, globalIdx) {
        const key = getNoteKey(note);
        const isFav = favSet.has(key);
        const rating = (note["Rating"] || "").trim().toUpperCase();
        const ratingClass = ["S", "A", "B"].includes(rating) ? `rating-${rating}` : "rating-other";
        const tags = Array.isArray(note.tags) ? note.tags : [];
        const pattern = note["句型"] || "";
        const explain = note["讲解"] || "";
        const example = note["例句"] || "";
        const trans = note["翻译"] || "";

        return `
          <article class="note-card ${isFav ? "is-fav" : ""}" data-key="${escapeAttr(key)}">
            <div class="card-meta">
              <div class="meta-left">
                <span class="card-index">#${globalIdx}</span>
                ${rating ? `<span class="rating-pill ${ratingClass}">${escapeHtml(rating)}</span>` : ""}
                ${note.deckName ? `<span class="deck-tag">${escapeHtml(note.deckName)}</span>` : ""}
                ${tags.map(t => `<span class="tag-item">#${escapeHtml(t)}</span>`).join("")}
              </div>

              <div class="card-actions">
                <button
                  class="action-icon-btn fav-btn ${isFav ? "active" : ""}"
                  data-fav="${escapeAttr(key)}"
                  title="${isFav ? "取消收藏" : "收藏此笔记"}"
                >
                  ${ICONS.star}
                </button>
                <button
                  class="action-icon-btn"
                  data-copy="${escapeAttr(stripHtml(pattern) + (example ? "\n" + stripHtml(example) : ""))}"
                  title="复制句型与例句"
                >
                  ${ICONS.copy}
                </button>
                <button
                  class="action-icon-btn"
                  data-speak="${escapeAttr(stripHtml(pattern))}"
                  title="朗读句型"
                >
                  ${ICONS.speaker}
                  <span>朗读</span>
                </button>
              </div>
            </div>

            <div class="pattern-text searchable">${sanitizeField(pattern)}</div>

            ${explain ? `
              <div class="field-block">
                <div class="field-label">讲解</div>
                <div class="field-content spoiler searchable">${sanitizeField(explain)}</div>
              </div>
            ` : ""}

            ${(example || trans) ? `
              <div class="example-box">
                ${example ? `
                  <div class="example-en-row">
                    <div class="example-en searchable">${sanitizeField(example)}</div>
                    <button
                      class="action-icon-btn"
                      data-speak="${escapeAttr(stripHtml(example))}"
                      title="朗读例句"
                      style="flex-shrink:0;"
                    >
                      ${ICONS.speaker}
                    </button>
                  </div>
                ` : ""}
                ${trans ? `<div class="example-zh spoiler searchable">${sanitizeField(trans)}</div>` : ""}
              </div>
            ` : ""}
          </article>
        `;
      }

      function buildPageNumbers(current, total) {
        if (total <= 7) {
          return Array.from({ length: total }, (_, i) => i + 1);
        }
        const pages = [1];
        if (current > 3) pages.push("...");
        const start = Math.max(2, current - 1);
        const end = Math.min(total - 1, current + 1);
        for (let i = start; i <= end; i++) pages.push(i);
        if (current < total - 2) pages.push("...");
        pages.push(total);
        return pages;
      }

      function renderPagination(totalItems, totalPages, startIdx, endIdx) {
        if (state.luckyNotes || totalItems === 0) {
          el.paginationWrap.innerHTML = "";
          return;
        }
        const pages = buildPageNumbers(state.page, totalPages);
        el.paginationWrap.innerHTML = `
          <nav class="pagination-bar" aria-label="分页导航">
            <div class="page-info">
              第 <strong>${state.page}</strong> / ${totalPages} 页 · 显示第 <strong>${startIdx + 1}–${endIdx}</strong> 条（共 ${totalItems} 条）
            </div>
            <div class="page-controls">
              <button class="page-btn" data-page="${state.page - 1}" ${state.page <= 1 ? "disabled" : ""} title="上一页">
                ${ICONS.chevLeft}
              </button>
              ${pages.map(p => p === "..."
                ? `<span class="page-ellipsis">…</span>`
                : `<button class="page-btn ${p === state.page ? "active" : ""}" data-page="${p}">${p}</button>`
              ).join("")}
              <button class="page-btn" data-page="${state.page + 1}" ${state.page >= totalPages ? "disabled" : ""} title="下一页">
                ${ICONS.chevRight}
              </button>
            </div>
          </nav>
        `;
      }

      function renderAll() {
        const isLuckyMode = Array.isArray(state.luckyNotes);
        const filtered = isLuckyMode ? state.luckyNotes : getFilteredNotes();
        const totalItems = filtered.length;
        const totalPages = isLuckyMode ? 1 : Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
        state.page = Math.max(1, Math.min(state.page, totalPages));

        const startIdx = isLuckyMode ? 0 : (state.page - 1) * PAGE_SIZE;
        const endIdx = isLuckyMode ? totalItems : Math.min(startIdx + PAGE_SIZE, totalItems);
        const pageNotes = isLuckyMode ? filtered : filtered.slice(startIdx, endIdx);

        const favCount = getCurrentDatasetFavCount();
        el.totalCountBadge.textContent = isLuckyMode
          ? `随机 ${totalItems} / ${allNotes.length} 条`
          : (totalItems === allNotes.length ? `${allNotes.length} 条` : `${totalItems} / ${allNotes.length} 条`);

        el.favCountPill.textContent = favCount;
        el.onlyFavBtn.classList.toggle("active", !isLuckyMode && state.onlyFav);
        el.luckyBtn.classList.toggle("active", isLuckyMode);
        el.searchClearBtn.classList.toggle("visible", state.search.length > 0);

        el.toggleBlurBtn.classList.toggle("btn-active", state.blurMode);
        el.blurIconWrap.innerHTML = state.blurMode ? ICONS.eyeOff : ICONS.eye;
        el.blurLabel.textContent = state.blurMode ? "遮罩开启" : "背诵遮罩";
        el.cardList.classList.toggle("blur-mode", state.blurMode);

        renderFilters();

        const isOnline = navigator.onLine;
        const sourceMap = {
          remote: "远程离线缓存",
          local_file: "本地导入缓存",
          sample: "内置示例"
        };
        const sourceText = sourceMap[cacheMeta.source] || "本地缓存";
        const timeText = cacheMeta.updatedAt ? ` · ${formatSyncTime(cacheMeta.updatedAt)}` : "";

        const hasFilter = state.search || state.rating !== "ALL" || state.tag !== "ALL" || state.onlyFav;
        el.statusBar.innerHTML = `
          <div class="status-left">
            <span class="offline-pill" title="数据已保存于本地，断网亦可正常浏览">
              <span class="status-dot ${isOnline ? "" : "offline"}"></span>
              ${isOnline ? "在线" : "离线模式"} · ${sourceText}${timeText}
            </span>
            ${isLuckyMode ? `
              <span class="lucky-pill">
                ${ICONS.dice} 试试手气模式 · 随机抽取 ${totalItems} 条
              </span>
            ` : `
              <span>
                ${totalItems > 0
                  ? `每页 ${PAGE_SIZE} 条 · 当前第 ${startIdx + 1}–${endIdx} 条`
                  : `暂无匹配笔记`}
              </span>
            `}
          </div>
          <div class="status-actions">
            ${isLuckyMode ? `
              <button class="text-link-btn lucky-link" id="rerollLuckyBtn">
                ${ICONS.dice} 再抽 3 条
              </button>
              <button class="text-link-btn" id="exitLuckyBtn">退出手气模式</button>
            ` : `
              ${favCount > 0 ? `
                <button class="text-link-btn" id="exportFavBtn">
                  ${ICONS.download} 导出收藏 (${favCount})
                </button>
              ` : ""}
              ${hasFilter ? `
                <button class="text-link-btn" id="resetFilterBtn">重置筛选</button>
              ` : ""}
            `}
          </div>
        `;

        if (pageNotes.length === 0) {
          el.cardList.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">${ICONS.inbox}</div>
              <div class="empty-title">
                ${state.onlyFav ? "收藏夹还是空的" : "没有找到匹配的句型笔记"}
              </div>
              <div class="empty-desc">
                ${state.onlyFav
                  ? "点击卡片右上角的星标按钮即可收藏重点句型，方便集中复习。"
                  : "试试更换搜索关键词、清除筛选条件，或者点击右上角「同步远程」/「导入 JSON」。"}
              </div>
              ${hasFilter ? `<button class="btn btn-primary" id="emptyResetBtn">查看全部笔记</button>` : ""}
            </div>
          `;
        } else {
          el.cardList.innerHTML = pageNotes
            .map((note, idx) => renderCard(note, startIdx + idx + 1))
            .join("");

          if (!isLuckyMode && state.search.trim()) {
            el.cardList.querySelectorAll(".searchable").forEach(node => {
              highlightMatches(node, state.search);
            });
          }
        }

        renderPagination(totalItems, totalPages, startIdx, endIdx);
      }

      // 事件监听
      el.themeToggleBtn.addEventListener("click", () => {
        isDark = !isDark;
        saveTheme(isDark);
        shell.classList.toggle("theme-dark", isDark);
        el.themeToggleBtn.innerHTML = isDark ? ICONS.sun : ICONS.moon;
        syncOuterBodyBg();
      });

      el.luckyBtn.addEventListener("click", () => {
        pickLuckyThree();
      });

      el.toggleBlurBtn.addEventListener("click", () => {
        state.blurMode = !state.blurMode;
        renderAll();
      });

      el.syncRemoteBtn.addEventListener("click", () => {
        syncRemoteData(false);
      });

      el.onlyFavBtn.addEventListener("click", () => {
        state.luckyNotes = null;
        state.onlyFav = !state.onlyFav;
        state.page = 1;
        renderAll();
      });

      let isComposing = false;
      el.searchInput.addEventListener("compositionstart", () => { isComposing = true; });
      el.searchInput.addEventListener("compositionend", (e) => {
        isComposing = false;
        state.luckyNotes = null;
        state.search = e.target.value;
        state.page = 1;
        renderAll();
      });
      el.searchInput.addEventListener("input", (e) => {
        if (isComposing) return;
        state.luckyNotes = null;
        state.search = e.target.value;
        state.page = 1;
        renderAll();
      });

      el.searchClearBtn.addEventListener("click", () => {
        el.searchInput.value = "";
        state.luckyNotes = null;
        state.search = "";
        state.page = 1;
        el.searchInput.focus();
        renderAll();
      });

      el.filterRow.addEventListener("click", (e) => {
        const ratingChip = e.target.closest("[data-rating]");
        if (ratingChip) {
          state.luckyNotes = null;
          state.rating = ratingChip.getAttribute("data-rating");
          state.page = 1;
          renderAll();
          return;
        }
        const tagChip = e.target.closest("[data-tag]");
        if (tagChip) {
          const clickedTag = tagChip.getAttribute("data-tag");
          state.luckyNotes = null;
          state.tag = state.tag === clickedTag ? "ALL" : clickedTag;
          state.page = 1;
          renderAll();
        }
      });

      el.statusBar.addEventListener("click", (e) => {
        if (e.target.closest("#rerollLuckyBtn")) {
          pickLuckyThree();
          return;
        }
        if (e.target.closest("#exitLuckyBtn")) {
          state.luckyNotes = null;
          renderAll();
          return;
        }
        if (e.target.closest("#resetFilterBtn")) {
          el.searchInput.value = "";
          state.search = "";
          state.rating = "ALL";
          state.tag = "ALL";
          state.onlyFav = false;
          state.luckyNotes = null;
          state.page = 1;
          renderAll();
          return;
        }
        if (e.target.closest("#exportFavBtn")) {
          const favNotes = allNotes.filter(n => favSet.has(getNoteKey(n)));
          if (favNotes.length === 0) return;
          const blob = new Blob([JSON.stringify(favNotes, null, 2)], { type: "application/json;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `anki-favorites-${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast(`已导出 ${favNotes.length} 条收藏笔记`);
        }
      });

      el.cardList.addEventListener("click", (e) => {
        const resetBtn = e.target.closest("#emptyResetBtn");
        if (resetBtn) {
          el.searchInput.value = "";
          state.search = "";
          state.rating = "ALL";
          state.tag = "ALL";
          state.onlyFav = false;
          state.luckyNotes = null;
          state.page = 1;
          renderAll();
          return;
        }

        const favBtn = e.target.closest("[data-fav]");
        if (favBtn) {
          const key = favBtn.getAttribute("data-fav");
          if (favSet.has(key)) {
            favSet.delete(key);
            showToast("已取消收藏");
          } else {
            favSet.add(key);
            showToast("已加入收藏夹 ★");
          }
          saveFavorites();
          renderAll();
          return;
        }

        const copyBtn = e.target.closest("[data-copy]");
        if (copyBtn) {
          copyText(copyBtn.getAttribute("data-copy"));
          return;
        }

        const speakBtn = e.target.closest("[data-speak]");
        if (speakBtn) {
          speakUS(speakBtn.getAttribute("data-speak"));
          return;
        }

        const spoiler = e.target.closest(".spoiler");
        if (spoiler && state.blurMode) {
          spoiler.classList.toggle("revealed");
        }
      });

      el.paginationWrap.addEventListener("click", (e) => {
        const pageBtn = e.target.closest("[data-page]");
        if (!pageBtn || pageBtn.disabled) return;
        const targetPage = Number(pageBtn.getAttribute("data-page"));
        if (!Number.isFinite(targetPage) || targetPage === state.page) return;
        state.page = targetPage;
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      el.jsonFileInput.addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const rawJson = JSON.parse(ev.target.result);
            const data = extractNotesArray(rawJson);
            if (!data) {
              showToast("JSON 格式错误：根节点必须是数组 [...]");
              return;
            }
            allNotes = data;
            state.rating = "ALL";
            state.tag = "ALL";
            state.onlyFav = false;
            state.luckyNotes = null;
            state.page = 1;
            await saveOfflineNotes(allNotes, "local_file");
            renderAll();
            showToast(`成功导入并离线缓存 ${allNotes.length} 条笔记！`);
          } catch (err) {
            showToast("JSON 解析失败：" + err.message);
          } finally {
            el.jsonFileInput.value = "";
          }
        };
        reader.readAsText(file, "utf-8");
      });

      window.addEventListener("online", () => {
        renderAll();
        showToast("网络已恢复，可点击「同步远程」更新最新笔记");
      });

      window.addEventListener("offline", () => {
        renderAll();
        showToast("网络已断开，已自动切换为本地离线模式");
      });

      if ("speechSynthesis" in window) {
        window.speechSynthesis.getVoices();
      }

      // 启动流程：优先加载本地离线缓存；若首次无缓存，则自动拉取远程 Spoken.json 并缓存
      (async function initApp() {
        const cached = await loadOfflineNotes();
        if (cached.notes) {
          allNotes = cached.notes;
          renderAll();
        } else {
          renderAll();
          syncRemoteData(true);
        }
      })();
    })();
  </script>
</body>
</html>
