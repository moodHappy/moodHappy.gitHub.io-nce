<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极简单词引擎</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --btn-bg: #0f172a;
            --btn-hover: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #e2e8f0 0%, #f8fafc 100%);
            color: var(--text-main);
            overflow: hidden;
        }

        /* 核心卡片设计 */
        .card {
            width: 90%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1), 
                        0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.3s ease;
        }

        /* 单词主显区：加入防折行和溢出隐藏 */
        .word-display {
            width: 100%; /* 限制最大宽度为父容器 */
            font-size: 4.5rem; /* 初始超大字体 */
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #0f172a, #334155);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap; /* 🌟 绝对禁止换行（拐弯） */
            overflow: hidden;    /* 配合 JS 检测真实宽度 */
            line-height: 1.2;
            min-height: 1.2em;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* 音标区域 */
        .phonetics {
            display: flex;
            gap: 15px;
            font-size: 1.1rem;
            color: var(--text-muted);
            font-family: "Lucida Sans Unicode", "Arial", sans-serif;
            margin-bottom: 25px;
            min-height: 1.5em;
        }

        .phonetics span {
            background: rgba(241, 245, 249, 0.8);
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* 分割线 */
        .divider {
            width: 60px;
            height: 4px;
            background-color: #cbd5e1;
            border-radius: 2px;
            margin-bottom: 25px;
        }

        /* 释义渲染区域 */
        .dictionary-area {
            width: 100%;
            min-height: 80px;
            margin-bottom: 35px;
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .dict-entry {
            width: 100%;
            text-align: left;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            border-left: 4px solid var(--accent);
            animation: fadeIn 0.4s ease forwards;
        }

        .status-msg {
            color: var(--text-muted);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .error { color: #ef4444; }
        
        /* 极致手感的按钮 */
        button {
            width: 100%;
            padding: 18px 0;
            font-size: 1.25rem;
            font-weight: 700;
            color: white;
            background: var(--btn-bg);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 10px 20px -10px rgba(15, 23, 42, 0.5);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover {
            background: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -10px rgba(15, 23, 42, 0.6);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 5px 10px -5px rgba(15, 23, 42, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pulse {
            animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="word-display" class="word-display pulse">加载中...</div>
        
        <div id="phonetics" class="phonetics"></div>
        <div class="divider"></div>
        
        <div id="dictionary-area" class="dictionary-area">
            <div class="status-msg">正在从 GitHub 获取词库引擎...</div>
        </div>

        <button id="random-btn">随机一个单词</button>
    </div>

    <script>
        const txtUrl = 'https://raw.githubusercontent.com/moodHappy/HelloWorld/refs/heads/master/Notes/one.txt';
        let wordsList = [];
        let currentWord = "";

        const els = {
            word: document.getElementById('word-display'),
            phonetics: document.getElementById('phonetics'),
            dictArea: document.getElementById('dictionary-area'),
            btn: document.getElementById('random-btn')
        };

        // 🌟 动态字体计算：保证长单词在一行内完全显示，不拐弯
        function adjustFontSize() {
            // 先重置为最大字号
            els.word.style.fontSize = '4.5rem';
            let currentSize = 4.5;
            
            // 如果内部文本真实宽度 (scrollWidth) 大于可视宽度 (clientWidth)
            // 就循环减小字号，直到能够完全容纳
            while (els.word.scrollWidth > els.word.clientWidth && currentSize > 1) {
                currentSize -= 0.1;
                els.word.style.fontSize = currentSize + 'rem';
            }
        }

        // 1. 获取并解析文本文件
        async function fetchWords() {
            try {
                const response = await fetch(txtUrl);
                if (!response.ok) throw new Error('网络请求失败');
                
                const text = await response.text();
                wordsList = text.split(/\r?\n/).map(w => w.trim()).filter(w => w.length > 0);
                
                if (wordsList.length > 0) {
                    showRandomWord();
                } else {
                    els.word.innerText = '空词库';
                    els.word.classList.remove('pulse');
                    els.dictArea.innerHTML = '<span class="status-msg error">⚠️ 词库文件内没有单词</span>';
                }
            } catch (error) {
                console.error('获取词库出错:', error);
                els.word.innerText = '网络错误';
                els.word.classList.remove('pulse');
                els.dictArea.innerHTML = '<span class="status-msg error">❌ 无法连接到 GitHub</span>';
            }
        }

        // 2. 随机挑选单词并呼叫油猴脚本
        function showRandomWord() {
            if (wordsList.length === 0) return;
            
            // UI 切换动画准备
            els.word.style.opacity = 0;
            els.word.style.transform = "scale(0.95)";
            
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * wordsList.length);
                currentWord = wordsList[randomIndex];
                
                // 更新单词 UI
                els.word.innerText = currentWord;
                els.word.classList.remove('pulse');
                
                // 触发字体自适应校验
                adjustFontSize();
                
                // 动画恢复
                els.word.style.opacity = 1;
                els.word.style.transform = "scale(1)";
                
                // 重置释义和音标 UI
                els.phonetics.innerHTML = '';
                els.dictArea.innerHTML = '<div class="status-msg pulse">✨ 正在呼叫词典引擎跨域抓取...</div>';

                // 向油猴脚本发送求助信号
                window.dispatchEvent(new CustomEvent('TM_Dict_Request', {
                    detail: { word: currentWord }
                }));
            }, 200);
        }

        // 3. 监听油猴脚本传回的词典数据
        window.addEventListener('TM_Dict_Response', function(e) {
            const returnedWord = e.detail.word;
            const data = e.detail.data;

            if (returnedWord !== currentWord) return;

            if (!data) {
                els.dictArea.innerHTML = '<div class="status-msg error">❌ 词典请求超时或无数据</div>';
                return;
            }

            renderDictionary(data);
        });

        // 4. 解析并渲染有道词典的 JSON 数据
        function renderDictionary(data) {
            let ukPhone = '', usPhone = '', translations = [];

            try {
                if (data.simple && data.simple.word && data.simple.word[0]) {
                    if (data.simple.word[0].ukphone) ukPhone = `UK [${data.simple.word[0].ukphone}]`;
                    if (data.simple.word[0].usphone) usPhone = `US [${data.simple.word[0].usphone}]`;
                }

                if (data.ec && data.ec.word && data.ec.word[0] && data.ec.word[0].trs) {
                    translations = data.ec.word[0].trs.map(t => {
                        return t.tr[0].l.i[0];
                    }).filter(t => t);
                } else if (data.web_trans && data.web_trans.web_translation) {
                    translations = data.web_trans.web_translation[0].value;
                }
            } catch (err) {
                console.error("解析字典数据出错:", err);
            }

            els.phonetics.innerHTML = '';
            if (ukPhone) els.phonetics.innerHTML += `<span>${ukPhone}</span>`;
            if (usPhone) els.phonetics.innerHTML += `<span>${usPhone}</span>`;

            if (translations.length > 0) {
                els.dictArea.innerHTML = translations.map(tr => 
                    `<div class="dict-entry">${tr}</div>`
                ).join('');
            } else {
                els.dictArea.innerHTML = '<div class="status-msg">⚠️ 暂无该词的释义数据</div>';
            }
        }

        // 绑定按钮事件
        els.btn.addEventListener('click', showRandomWord);

        // 如果遇到手机屏幕旋转或分屏，自动重新计算字体大小
        window.addEventListener('resize', () => {
            if (currentWord) adjustFontSize();
        });

        // 启动
        fetchWords();
    </script>
</body>
</html>
