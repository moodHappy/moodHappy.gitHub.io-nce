<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Porcelain Engine</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --accent: #007aff;
            --divider: #e5e5ea;
            --danger: #ff3b30;
            --btn-bg: #1d1d1f;
            --btn-text: #ffffff;
            --star-gold: #ffcc00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* 页面切换层级设计 */
        .page {
            display: none;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0; 
            left: 0;
        }
        .page.active {
            display: flex;
            animation: fadeIn 0.3s ease forwards;
        }

        /* 核心卡片设计 */
        .card {
            width: 90%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 28px;
            padding: 40px 25px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        /* 第一页：主显区 */
        .word-display {
            width: 100%;
            text-align: center;
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--text-main);
            white-space: nowrap; 
            overflow: hidden;
            line-height: 1.1;
            min-height: 1.1em;
            margin-bottom: 12px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .phonetics-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            font-size: 1.1rem;
            color: var(--text-muted);
            font-family: "Lucida Sans Unicode", "Arial", sans-serif;
            margin-bottom: 25px;
            min-height: 30px;
        }

        .speaker-btn {
            color: var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(0, 122, 255, 0.08);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .speaker-btn:active { 
            background: rgba(0, 122, 255, 0.15); 
            transform: scale(0.92); 
        }

        .divider {
            width: 50px;
            height: 3px;
            border-radius: 2px;
            background-color: var(--divider);
            margin-bottom: 25px;
        }

        .dictionary-area {
            width: 100%;
            min-height: 150px;
            max-height: 40vh;
            overflow-y: auto;
            font-size: 1.1rem;
            line-height: 1.6;
            padding: 0 10px;
            text-align: left;
        }
        
        .dictionary-area::-webkit-scrollbar { width: 4px; }
        .dictionary-area::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 4px; }

        .gt-meanings { list-style: none; padding: 0; margin: 0; }
        .gt-meanings li { margin-bottom: 10px; display: flex; align-items: baseline; animation: fadeIn 0.4s ease forwards; }
        .gt-pos { 
            color: var(--text-muted); 
            font-size: 0.85rem; 
            background: #f2f2f7; 
            padding: 3px 8px; 
            border-radius: 6px; 
            margin-right: 12px; 
            flex-shrink: 0; 
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .gt-def { color: var(--text-main); word-break: break-word; font-weight: 400; }

        .gt-ex-box {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed var(--divider);
            font-size: 0.95rem;
        }
        .gt-ex-en { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 6px; color: var(--text-main); line-height: 1.5; }
        .gt-ex-zh { color: var(--text-muted); line-height: 1.4; }

        .status-msg {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100px;
            color: var(--text-muted);
            font-size: 0.95rem;
            text-align: center;
            letter-spacing: 0.5px;
            line-height: 1.6;
        }
        .status-msg.error { color: var(--danger); height: auto; padding: 20px 0; }

        .retry-btn {
            margin-top: 18px;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            background: var(--text-main);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        .retry-btn:active { transform: scale(0.92); }

        /* NEXT 主操作按钮 */
        button.action-btn {
            margin-top: 30px;
            width: 100%;
            padding: 18px 0;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--btn-text);
            background: var(--btn-bg);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        button.action-btn:active {
            transform: scale(0.96);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }

        /* 第二页：历史记录卡片 */
        .history-card {
            align-items: stretch;
            padding: 30px 20px;
        }
        .history-header {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 20px;
            color: var(--text-main);
            letter-spacing: 1px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: 60vh;
            padding-right: 5px;
        }
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 4px; }
        
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: var(--bg-color);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .history-item:active {
            transform: scale(0.96);
            background: #e5e5ea;
        }
        .history-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        /* 收藏星星按钮 */
        .star-btn {
            color: #d1d1d6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            margin-left: -4px;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .star-btn:active {
            transform: scale(0.8);
            background: rgba(0,0,0,0.05);
        }
        .star-btn.active {
            color: var(--star-gold);
        }

        .history-word {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .history-time {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* 底部页面指示器 */
        .page-indicator {
            position: absolute;
            bottom: 25px;
            left: 0; 
            right: 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            pointer-events: none;
        }
        .dot {
            width: 6px; 
            height: 6px; 
            border-radius: 50%; 
            background: #d1d1d6; 
            transition: all 0.3s ease;
        }
        .dot.active {
            width: 18px; 
            border-radius: 3px; 
            background: var(--text-muted);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pulse { animation: pulse 1.5s infinite ease-in-out; }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    </style>
</head>
<body>

    <!-- 主页面 -->
    <div id="page-main" class="page active">
        <div class="card">
            <div id="word-display" class="word-display pulse">LOADING</div>
            
            <div id="phonetics" class="phonetics-row"></div>
            <div class="divider"></div>
            
            <div id="dictionary-area" class="dictionary-area">
                <div class="status-msg pulse">Fetching Database...</div>
            </div>

            <button id="random-btn" class="action-btn">NEXT</button>
        </div>
    </div>

    <!-- 历史记录页面 -->
    <div id="page-history" class="page">
        <div class="card history-card">
            <div class="history-header">Recent 24h & Favorites</div>
            <div class="history-list" id="history-list">
                <!-- 动态渲染 -->
            </div>
        </div>
    </div>

    <!-- 页面底部指示器 -->
    <div class="page-indicator">
        <div class="dot active" id="dot-main"></div>
        <div class="dot" id="dot-history"></div>
    </div>

    <script>
        let wordsList = [];
        let currentWord = "";
        const activeAudio = new Audio();
        let dictCache = {}; 

        // 历史记录数组 (无缝兼容旧版数据，存入新版 key)
        let wordHistory = JSON.parse(localStorage.getItem('PorcelainHistory_v2')) || 
                          JSON.parse(localStorage.getItem('PorcelainHistory_v1')) || [];

        const els = {
            word: document.getElementById('word-display'),
            phonetics: document.getElementById('phonetics'),
            dictArea: document.getElementById('dictionary-area'),
            btn: document.getElementById('random-btn'),
            historyList: document.getElementById('history-list'),
            dotMain: document.getElementById('dot-main'),
            dotHistory: document.getElementById('dot-history')
        };

        function adjustFontSize() {
            els.word.style.fontSize = '4.5rem';
            let currentSize = 4.5;
            while (els.word.scrollWidth > els.word.clientWidth && currentSize > 1) {
                currentSize -= 0.1;
                els.word.style.fontSize = currentSize + 'rem';
            }
        }

        function playAudio(text, event) {
            if(event) event.stopPropagation();
            if(!text) return;
            const url = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(text)}&type=2`;
            activeAudio.src = url;
            activeAudio.play().catch(e => console.log('Audio error:', e));
        }

        // ================= 历史记录与收藏核心逻辑 =================
        function saveToHistory(word) {
            // 查找是否已经存在（保留其收藏状态）
            let existingItem = wordHistory.find(item => item.word === word);
            let isStarred = existingItem ? existingItem.starred : false;
            
            // 剔除旧的，移到最前
            wordHistory = wordHistory.filter(item => item.word !== word);
            wordHistory.unshift({ word: word, time: Date.now(), starred: isStarred });
            
            cleanAndSaveHistory();
        }

        // 切换收藏状态
        window.toggleStar = function(event, word) {
            event.stopPropagation(); // 阻止点击事件冒泡到父级卡片
            let index = wordHistory.findIndex(item => item.word === word);
            if (index > -1) {
                wordHistory[index].starred = !wordHistory[index].starred;
                cleanAndSaveHistory();
                renderHistory(); // 重新渲染列表刷新星星颜色
            }
        };

        function cleanAndSaveHistory() {
            const now = Date.now();
            const oneDay = 24 * 60 * 60 * 1000;
            
            // 核心规则：保留星标收藏的，或者 24 小时以内的
            wordHistory = wordHistory.filter(item => item.starred || (now - item.time < oneDay));
            
            // 防止无限制膨胀 (最大容量 500)
            if (wordHistory.length > 500) {
                let starred = wordHistory.filter(i => i.starred);
                let unstarred = wordHistory.filter(i => !i.starred).slice(0, 500 - starred.length);
                wordHistory = [...starred, ...unstarred];
                wordHistory.sort((a, b) => b.time - a.time);
            }
            
            localStorage.setItem('PorcelainHistory_v2', JSON.stringify(wordHistory));
        }

        function renderHistory() {
            cleanAndSaveHistory();
            if (wordHistory.length === 0) {
                els.historyList.innerHTML = '<div style="text-align:center;color:var(--text-muted);margin-top:40px;">No records yet.</div>';
                return;
            }
            
            // 苹果风 SVG 星星
            const starSvg = `<svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="var(--fill-color, none)"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
            
            els.historyList.innerHTML = wordHistory.map(item => {
                const timeStr = new Date(item.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const starClass = item.starred ? 'active' : '';
                const fillStyle = item.starred ? 'style="--fill-color: currentColor;"' : '';
                
                return `
                    <div class="history-item" onclick="loadFromHistory('${item.word}')">
                        <div class="history-item-left">
                            <div class="star-btn ${starClass}" onclick="toggleStar(event, '${item.word}')" ${fillStyle}>
                                ${starSvg}
                            </div>
                            <span class="history-word">${item.word}</span>
                        </div>
                        <span class="history-time">${timeStr}</span>
                    </div>
                `;
            }).join('');
        }

        window.loadFromHistory = function(word) {
            switchPage('page-main');
            currentWord = word;
            
            els.word.innerText = currentWord;
            els.word.classList.remove('pulse');
            adjustFontSize();
            els.word.style.opacity = 1;
            
            els.phonetics.innerHTML = '';
            els.dictArea.innerHTML = '<div class="status-msg pulse">Fetching Definition...</div>';

            setTimeout(() => playAudio(currentWord), 150);
            requestDictionaryData(currentWord);
            
            // 更新该词时间戳使其重回顶部，且不丢失收藏状态
            saveToHistory(currentWord); 
        };

        // ================= 页面切换与手势逻辑 =================
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            
            if (pageId === 'page-history') {
                renderHistory();
                els.dotMain.classList.remove('active');
                els.dotHistory.classList.add('active');
            } else {
                els.dotHistory.classList.remove('active');
                els.dotMain.classList.add('active');
            }
        }

        let twoFingerTouch = false;
        let startX = 0;

        document.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                twoFingerTouch = true;
                startX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            } else {
                twoFingerTouch = false;
            }
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (!twoFingerTouch) return;
            if (e.touches.length === 2) {
                let currentX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                let diffX = startX - currentX;
                
                if (diffX > 60) {
                    switchPage('page-history');
                    twoFingerTouch = false; 
                } else if (diffX < -60) {
                    switchPage('page-main');
                    twoFingerTouch = false;
                }
            }
        }, { passive: true });


        // ================= 网络抓取与渲染逻辑 =================
        async function fetchWords() {
            const fetchUrls = [
                'https://raw.githubusercontent.com/moodHappy/HelloWorld/refs/heads/master/Notes/one.txt',
                'https://cdn.jsdelivr.net/gh/moodHappy/HelloWorld@master/Notes/one.txt',
                'https://ghproxy.net/https://raw.githubusercontent.com/moodHappy/HelloWorld/refs/heads/master/Notes/one.txt'
            ];

            for (let url of fetchUrls) {
                try {
                    const response = await fetch(url, { timeout: 5000 });
                    if (response.ok) {
                        const text = await response.text();
                        wordsList = text.split(/\r?\n/).map(w => w.trim()).filter(w => w.length > 0);
                        if (wordsList.length > 0) {
                            showRandomWord();
                            return; 
                        }
                    }
                } catch (error) {
                    console.warn(`Node failed, trying next...`);
                }
            }
            
            els.word.innerText = 'ERROR';
            els.word.classList.remove('pulse');
            els.dictArea.innerHTML = '<div class="status-msg error">Failed to load words.<br>Check your network.</div>';
        }

        function showRandomWord() {
            if (wordsList.length === 0) return;
            
            els.word.style.opacity = 0;
            
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * wordsList.length);
                currentWord = wordsList[randomIndex];
                
                els.word.innerText = currentWord;
                els.word.classList.remove('pulse');
                adjustFontSize();
                els.word.style.opacity = 1;
                
                els.phonetics.innerHTML = '';
                els.dictArea.innerHTML = '<div class="status-msg pulse">Fetching Definition...</div>';

                setTimeout(() => playAudio(currentWord), 150);
                saveToHistory(currentWord);
                requestDictionaryData(currentWord);
            }, 200);
        }

        window.retryFetch = function() {
            els.dictArea.innerHTML = '<div class="status-msg pulse">Retrying...</div>';
            requestDictionaryData(currentWord);
        };

        async function requestDictionaryData(word) {
            if (dictCache[word]) {
                renderDictionary(word, dictCache[word]);
                return;
            }

            const url = `https://dict.youdao.com/jsonapi?q=${encodeURIComponent(word)}`;
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2500); 
                
                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);
                const data = await res.json();
                
                dictCache[word] = data;
                if (currentWord === word) renderDictionary(word, data);
            } 
            catch (err) {
                console.warn(`[CORS Blocked] Switching to Tampermonkey: ${word}`);
                els.dictArea.innerHTML = '<div class="status-msg pulse" style="color: var(--accent);">Bypassing CORS...</div>';

                const tmHandler = (e) => {
                    if (e.detail.word === word) {
                        window.removeEventListener('TM_Dict_Response', tmHandler);
                        if (e.detail.data) {
                            dictCache[word] = e.detail.data;
                            if (currentWord === word) renderDictionary(word, e.detail.data);
                        } else {
                            if (currentWord === word) renderDictionary(word, null);
                        }
                    }
                };

                window.addEventListener('TM_Dict_Response', tmHandler);
                window.dispatchEvent(new CustomEvent('TM_Dict_Request', { detail: { word: word } }));

                setTimeout(() => {
                    window.removeEventListener('TM_Dict_Response', tmHandler);
                    if (currentWord === word && els.dictArea.innerHTML.includes('Bypassing')) {
                        renderDictionary(word, null);
                    }
                }, 5000);
            }
        }

        function renderDictionary(targetWord, data) {
            if (currentWord !== targetWord) return; 

            if (!data) {
                els.dictArea.innerHTML = `
                    <div class="status-msg error">
                        ❌ Timeout or blocked.<br>Ensure Tampermonkey is active.
                        <button class="retry-btn" onclick="retryFetch()">RETRY</button>
                    </div>
                `;
                return;
            }

            let phonetic = '';
            let meaningsHtml = '';
            let exampleHtml = '';
            
            if (data.simple?.word?.[0]) {
                const w = data.simple.word[0];
                const p = w.usphone || w.ukphone || w.phone;
                if (p) phonetic = `/${p}/`;
            } else if (data.ec?.word?.[0]?.usphone) {
                phonetic = `/${data.ec.word[0].usphone}/`;
            }

            const bigSpk = `<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>`;
            if (phonetic) {
                els.phonetics.innerHTML = `
                    <span>${phonetic}</span>
                    <div class="speaker-btn" data-speak="${targetWord}" onclick="playAudio(this.getAttribute('data-speak'), event)">${bigSpk}</div>
                `;
            } else {
                els.phonetics.innerHTML = `<div class="speaker-btn" data-speak="${targetWord}" onclick="playAudio(this.getAttribute('data-speak'), event)">${bigSpk}</div>`;
            }

            if (data.ec?.word?.[0]?.trs) {
                data.ec.word[0].trs.forEach(item => {
                    const text = item.tr?.[0]?.l?.i?.join('；');
                    if (text) {
                        const match = text.match(/^([a-z]+\.)\s*(.+)/);
                        if (match) {
                            meaningsHtml += `<li><span class="gt-pos">${match[1]}</span><span class="gt-def">${match[2]}</span></li>`;
                        } else {
                            meaningsHtml += `<li><span class="gt-def">${text}</span></li>`;
                        }
                    }
                });
            } else if (data.web_trans?.["web-translation"]) {
                data.web_trans["web-translation"].slice(0, 3).forEach(item => {
                    meaningsHtml += `<li><span class="gt-pos">Web</span><span class="gt-def">${item.trans.map(t=>t.value).join('; ')}</span></li>`;
                });
            } else {
                meaningsHtml = `<li><span class="gt-def" style="color: var(--text-muted);">No definition found.</span></li>`;
            }

            const sents = data.blng_sents_part?.["sentence-pair"];
            if (sents && sents.length > 0) {
                const en = sents[0].sentence;
                const zh = sents[0]["sentence-translation"];
                if (en && zh) {
                    const cleanEnText = en.replace(/<[^>]+>/g, '');
                    const smSpk = `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>`;
                    exampleHtml = `
                        <div class="gt-ex-box">
                            <div class="gt-ex-en">
                                <div style="padding-right: 10px;">${en}</div>
                                <div class="speaker-btn" style="width:26px;height:26px;flex-shrink:0;background:rgba(0,122,255,0.05);" data-speak="${cleanEnText}" onclick="playAudio(this.getAttribute('data-speak'), event)">${smSpk}</div>
                            </div>
                            <div class="gt-ex-zh">${zh}</div>
                        </div>
                    `;
                }
            }

            els.dictArea.innerHTML = `<ul class="gt-meanings">${meaningsHtml}</ul>${exampleHtml}`;
        }

        els.btn.addEventListener('click', showRandomWord);
        window.addEventListener('resize', () => { if (currentWord) adjustFontSize(); });

        fetchWords();
    </script>
</body>
</html>
